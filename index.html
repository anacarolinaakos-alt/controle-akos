<script>
/* views.js — telas do sistema */
(function () {
  "use strict";
  var UI = window.UI, Fmt = window.Fmt, Calc = window.Calc, Store = window.Store;
  var el = UI.el;
  function brl(v) { return Fmt.brl(v); }
  function go(hash) { location.hash = hash; }
  function s() { return Store.state; }

  var Views = {};

  // tabela simples rótulo/valor (usada nos blocos de custo)
  function kvTable(rows) {
    return el("table", { class: "grid dre" }, [el("tbody", null, rows.map(function (r) {
      var neg = (typeof r.value === "number" && r.value < 0);
      var valTxt = (typeof r.value === "number") ? brl(r.value) : escTxt(String(r.value));
      return el("tr", { class: r.bold ? "sub" : "" }, [
        el("td", null, r.label),
        el("td", { class: "t-right" + (neg ? " neg" : ""), html: valTxt })
      ]);
    }))]);
  }
  function escTxt(v) { return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // monta a seção de custo de importação agrupada em blocos (editável)
  function custoSectionNode(p) {
    var c = p.custo || {};
    var hasCusto = (c.valorCIF != null || c.totalNFsaida != null || c.totalCusto != null || (c.despesasDespachante && c.despesasDespachante.length) || c.nfMRD != null);
    var editBtn = el("button", { class: "btn btn-primary", onclick: function () { editarCusto(p); } }, hasCusto ? "✎ Editar custos" : "+ Lançar custos");
    if (!hasCusto) {
      return UI.section("Custo de importação (landed cost)",
        el("div", { class: "empty" }, "Nenhum custo lançado ainda. Clique em “Lançar custos” para inserir CIF, impostos de nacionalização, despesas do despachante, NF de entrada/saída e o resumo."),
        [editBtn]);
    }
    var blocks = [];
    function block(title, rows) {
      var f = rows.filter(function (r) { return r.value !== null && r.value !== undefined && r.value !== ""; });
      if (!f.length) return;
      blocks.push(el("div", { class: "custo-block" }, [el("h3", { class: "sub-title" }, title), kvTable(f)]));
    }
    block("Mercadoria (CIF)", [
      { label: "FOB / Mercadoria", value: c.fob },
      { label: "Frete internacional", value: c.freteInternacional },
      { label: "Seguro internacional", value: c.seguroInternacional },
      { label: "Capatazias", value: c.capatazias },
      { label: "= Valor CIF", value: c.valorCIF, bold: true }
    ]);
    block("Impostos de nacionalização", [
      { label: "II – Imposto de Importação", value: c.ii },
      { label: "IPI", value: c.ipiNac },
      { label: "PIS", value: c.pisNac },
      { label: "COFINS", value: c.cofinsNac },
      { label: "ICMS", value: c.icmsNac },
      { label: "= Total impostos de nacionalização", value: c.impostosNacionalizacao, bold: true }
    ]);
    var desp = (c.despesasDespachante || []).map(function (d) { return { label: d.descricao, value: d.valor }; });
    desp.push({ label: "= Subtotal despesas do despachante", value: c.despachanteSubtotal, bold: true });
    block("Despesas do despachante", desp);
    block("Custo total da importação (landed cost)", [
      { label: "= CIF + nacionalização + despachante", value: c.totalCusto, bold: true }
    ]);
    block("NF de entrada (importação)", [
      { label: "Base de cálculo", value: c.baseEntrada },
      { label: "(–) Crédito de imposto IPI", value: c.creditoIpi },
      { label: "= Valor da NF de entrada", value: c.nfEntradaValor, bold: true }
    ]);
    block("Créditos de imposto (adquirente)", [
      { label: "PIS – DI", value: c.pisDI },
      { label: "COFINS – DI", value: c.cofinsDI },
      { label: "ICMS – NF de entrada", value: c.icmsEntradaCred },
      { label: "IPI – NF de entrada", value: c.ipiEntradaCred },
      { label: "= Total de crédito (adquirente)", value: c.creditoAdquirente, bold: true }
    ]);
    block("NF de saída", [
      { label: "Taxa administrativa (NF-e serviço MRD)", value: c.taxaAdmMRD },
      { label: "Base de cálculo", value: c.baseSaida },
      { label: "PIS", value: c.pisSaida },
      { label: "COFINS", value: c.cofinsSaida },
      { label: "ICMS", value: c.icmsSaida },
      { label: "DIFAL", value: c.difal },
      { label: "Margem + IR + CSLL", value: c.margemIRCSLL },
      { label: "IPI saída", value: c.ipiSaida },
      { label: "= Total da NF de saída", value: c.totalNFsaida, bold: true }
    ]);
    block("Resumo (MRD)", [
      { label: "NF MRD", value: c.nfMRD },
      { label: "Adiantamento (AKOS → MRD)", value: c.adiantamento },
      { label: "CIF (mercadoria + frete)", value: c.cifMercFrete },
      { label: "Saldo de NF-e", value: c.saldoNFe },
      { label: "(+) Prestação de serviço MRD", value: c.prestacaoServMRD },
      { label: "= Saldo a favor MRD", value: c.saldoFavorMRD, bold: true }
    ]);

    var content = [el("div", { class: "custo-grid" }, blocks)];
    if (c.rawRows && c.rawRows.length) {
      var raw = el("table", { class: "grid dre" }, [el("tbody", null, c.rawRows.map(function (rr) {
        var neg = (typeof rr.value === "number" && rr.value < 0);
        return el("tr", null, [el("td", null, rr.label), el("td", { class: "t-right" + (neg ? " neg" : "") }, rr.value == null ? "" : brl(rr.value))]);
      }))]);
      content.push(el("details", { class: "raw-details" }, [
        el("summary", null, "Ver detalhamento completo (como na planilha)"), raw
      ]));
    }
    return UI.section("Custo de importação (landed cost)", el("div", null, content), [editBtn]);
  }

  // ---- formulário editável do custo de importação ----
  function editarCusto(p) {
    var c = p.custo ? JSON.parse(JSON.stringify(p.custo)) : {};
    var inp = {}, disp = {};
    function n(v) { return (typeof v === "number" && isFinite(v)) ? v : 0; }
    function money(key, val, opts) {
      opts = opts || {};
      var i = el("input", { class: "inp t-right", type: "text", inputmode: "decimal", value: (val == null || val === "") ? "" : Fmt.money(val) });
      i.addEventListener("input", recompute);
      inp[key] = i; return i;
    }
    function field(label, key) { return el("label", { class: "field" }, [el("span", { class: "field-label" }, label), money(key, c[key])]); }
    function rd(key) { return Fmt.parseNum(inp[key] ? inp[key].value : null); }
    function calcRow(label, key) {
      var v = el("span", { class: "calc-val" }, "—"); disp[key] = v;
      return el("div", { class: "calc-line" }, [el("span", null, label), v]);
    }
    function grid(children) { return el("div", { class: "form-grid" }, children); }
    function sec(title, node) { return el("div", { class: "cust-sec" }, [el("h4", { class: "cust-sec-title" }, title), node]); }

    // despesas do despachante (linhas dinâmicas)
    var despWrap = el("div", { class: "desp-list" });
    function addDesp(d) {
      d = d || { descricao: "", valor: null };
      var di = el("input", { class: "inp", type: "text", placeholder: "Descrição da despesa", value: d.descricao || "" });
      var vi = el("input", { class: "inp t-right", type: "text", inputmode: "decimal", placeholder: "0,00", value: d.valor != null ? Fmt.money(d.valor) : "" });
      vi.addEventListener("input", recompute);
      var row = el("div", { class: "desp-row" });
      var rm = el("button", { class: "btn btn-danger btn-sm", onclick: function () { despWrap.removeChild(row); recompute(); } }, "✕");
      row.appendChild(di); row.appendChild(vi); row.appendChild(rm);
      row._d = di; row._v = vi;
      despWrap.appendChild(row);
    }
    (c.despesasDespachante || []).forEach(addDesp);

    function despTotal() { var t = 0; Array.prototype.forEach.call(despWrap.querySelectorAll(".desp-row"), function (r) { t += n(Fmt.parseNum(r._v.value)); }); return t; }

    function recompute() {
      var cif = n(rd("fob")) + n(rd("freteInternacional")) + n(rd("seguroInternacional")) + n(rd("capatazias"));
      var impNac = n(rd("ii")) + n(rd("ipiNac")) + n(rd("pisNac")) + n(rd("cofinsNac")) + n(rd("icmsNac"));
      var despSub = despTotal();
      var totalCusto = cif + impNac + despSub;
      var credAdq = n(rd("pisDI")) + n(rd("cofinsDI")) + n(rd("icmsEntradaCred")) + n(rd("ipiEntradaCred"));
      var totalSaida = n(rd("baseSaida")) + n(rd("pisSaida")) + n(rd("cofinsSaida")) + n(rd("icmsSaida")) + n(rd("difal")) + n(rd("margemIRCSLL")) + n(rd("ipiSaida"));
      var saldoNFe = n(rd("nfMRD")) - n(rd("adiantamento")) - cif;
      var saldoFav = saldoNFe + n(rd("prestacaoServMRD"));
      var set = function (k, v) { if (disp[k]) { disp[k].textContent = brl(v); disp[k].className = "calc-val" + (v < 0 ? " neg" : ""); } };
      set("valorCIF", cif); set("impostosNacionalizacao", impNac); set("despachanteSubtotal", despSub);
      set("totalCusto", totalCusto); set("creditoAdquirente", credAdq); set("totalNFsaida", totalSaida);
      set("saldoNFe", saldoNFe); set("saldoFavorMRD", saldoFav);
      recompute._vals = { cif: cif, impNac: impNac, despSub: despSub, totalCusto: totalCusto, credAdq: credAdq, totalSaida: totalSaida, saldoNFe: saldoNFe, saldoFav: saldoFav };
    }

    var body = el("div", { class: "cust-form" }, [
      sec("Mercadoria (CIF)", el("div", null, [
        grid([field("FOB / Mercadoria", "fob"), field("Frete internacional", "freteInternacional"), field("Seguro internacional", "seguroInternacional"), field("Capatazias", "capatazias")]),
        calcRow("= Valor CIF", "valorCIF")
      ])),
      sec("Impostos de nacionalização", el("div", null, [
        grid([field("II – Imposto de Importação", "ii"), field("IPI", "ipiNac"), field("PIS", "pisNac"), field("COFINS", "cofinsNac"), field("ICMS", "icmsNac")]),
        calcRow("= Total impostos de nacionalização", "impostosNacionalizacao")
      ])),
      sec("Despesas do despachante", el("div", null, [
        despWrap,
        el("button", { class: "btn btn-sm", onclick: function () { addDesp(); } }, "+ Adicionar despesa"),
        calcRow("= Subtotal despesas do despachante", "despachanteSubtotal")
      ])),
      sec("Custo total da importação (landed cost)", calcRow("= CIF + nacionalização + despachante", "totalCusto")),
      sec("NF de entrada (importação)", el("div", null, [
        grid([field("Base de cálculo", "baseEntrada"), field("(–) Crédito de imposto IPI", "creditoIpi"), field("Valor da NF de entrada", "nfEntradaValor")])
      ])),
      sec("Créditos de imposto (adquirente)", el("div", null, [
        grid([field("PIS – DI", "pisDI"), field("COFINS – DI", "cofinsDI"), field("ICMS – NF de entrada", "icmsEntradaCred"), field("IPI – NF de entrada", "ipiEntradaCred")]),
        calcRow("= Total de crédito (adquirente)", "creditoAdquirente")
      ])),
      sec("NF de saída", el("div", null, [
        grid([field("Taxa administrativa (NF-e serviço MRD)", "taxaAdmMRD"), field("Base de cálculo", "baseSaida"), field("PIS", "pisSaida"), field("COFINS", "cofinsSaida"), field("ICMS", "icmsSaida"), field("DIFAL", "difal"), field("Margem + IR + CSLL", "margemIRCSLL"), field("IPI saída", "ipiSaida")]),
        calcRow("= Total da NF de saída", "totalNFsaida")
      ])),
      sec("Resumo (MRD)", el("div", null, [
        grid([field("NF MRD", "nfMRD"), field("Adiantamento (AKOS → MRD)", "adiantamento"), field("(+) Prestação de serviço MRD", "prestacaoServMRD")]),
        calcRow("= Saldo de NF-e (NF MRD − Adiant. − CIF)", "saldoNFe"),
        calcRow("= Saldo a favor MRD", "saldoFavorMRD")
      ]))
    ]);

    recompute();

    UI.modal("Custos do processo " + p.id, body, {
      wide: true,
      buttons: [
        { label: "Cancelar", kind: "ghost" },
        { label: "Salvar custos", kind: "primary", onClick: function () {
            recompute();
            var v = recompute._vals;
            var despesas = [];
            Array.prototype.forEach.call(despWrap.querySelectorAll(".desp-row"), function (r) {
              var d = (r._d.value || "").trim(); var val = Fmt.parseNum(r._v.value);
              if (d || val != null) despesas.push({ descricao: d, valor: val });
            });
            var novo = {
              bl: c.bl || p.blAwb || null,
              fob: rd("fob"), freteInternacional: rd("freteInternacional"), seguroInternacional: rd("seguroInternacional"), capatazias: rd("capatazias"), valorCIF: v.cif,
              ii: rd("ii"), ipiNac: rd("ipiNac"), pisNac: rd("pisNac"), cofinsNac: rd("cofinsNac"), icmsNac: rd("icmsNac"), impostosNacionalizacao: v.impNac,
              despesasDespachante: despesas, despachanteSubtotal: v.despSub, totalCusto: v.totalCusto,
              baseEntrada: rd("baseEntrada"), creditoIpi: rd("creditoIpi"), nfEntradaValor: rd("nfEntradaValor"),
              pisDI: rd("pisDI"), cofinsDI: rd("cofinsDI"), icmsEntradaCred: rd("icmsEntradaCred"), ipiEntradaCred: rd("ipiEntradaCred"), creditoAdquirente: v.credAdq,
              taxaAdmMRD: rd("taxaAdmMRD"), baseSaida: rd("baseSaida"), pisSaida: rd("pisSaida"), cofinsSaida: rd("cofinsSaida"), icmsSaida: rd("icmsSaida"), difal: rd("difal"), margemIRCSLL: rd("margemIRCSLL"), ipiSaida: rd("ipiSaida"), totalNFsaida: v.totalSaida,
              nfMRD: rd("nfMRD"), adiantamento: rd("adiantamento"), cifMercFrete: v.cif, saldoNFe: v.saldoNFe, prestacaoServMRD: rd("prestacaoServMRD"), saldoFavorMRD: v.saldoFav,
              rawRows: null
            };
            Store.update("processos", p._id, { custo: novo });
            UI.toast("Custos salvos."); rerender();
          } }
      ]
    });
  }

  /* ----------------------------- DASHBOARD ----------------------------- */
  Views.dashboard = function () {
    var d = Calc.dashboard(s());
    var wrap = el("div");

    // valores da DRE (conferência) para os indicadores
    var dre = s().dre;
    function drRightRow(lbl) { return (dre && dre.right ? dre.right : []).filter(function (x) { return x.label.toLowerCase().trim() === lbl; })[0]; }
    function drRight(lbl) { var r = drRightRow(lbl); return r ? r.value : null; }
    function drNorm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
    function drLeft(sub) { if (!dre || !dre.left) return null; var r = dre.left.filter(function (x) { return drNorm(x.label).indexOf(sub) >= 0; })[0]; return r ? r.value : null; }
    var lucroAkos = drRight("lucro");
    var lucroLiquido = drLeft("lucro liquido");
    var lucroContainer = drLeft("lucro por container");
    var lucroOperacao = (lucroLiquido != null) ? lucroLiquido : lucroAkos;
    // Saldo de NF-e da MRD — vem da aba RESUMO da planilha (somado dos processos)
    var saldoNFeMRD = d.saldoNFe;
    var cam = s().cambio || [];
    var camRealizado = cam.reduce(function (a, c) { return a + Calc.n(c.cambioRealizado); }, 0);
    var camRealCount = cam.filter(function (c) { return Calc.n(c.cambioRealizado) > 0; }).length;

    // KPIs — linha 1
    wrap.appendChild(el("div", { class: "kpi-grid" }, [
      UI.kpi("Faturamento total", brl(d.faturamento), { kind: "primary", sub: d.nProcessos + " processos" }),
      UI.kpi("Recebido", brl(d.recebido), { kind: "ok", sub: Fmt.pct(d.pctRecebido) + " dos boletos recebido" }),
      UI.kpi("A receber", brl(d.aReceber), { kind: "info", sub: d.boletosAbertos + " boletos em aberto", onclick: function () { go("#/boletos"); } }),
      UI.kpi("Lucro da Operação", brl(lucroOperacao), { kind: "primary", sub: lucroContainer != null ? brl(lucroContainer) + " por container" : null, onclick: function () { go("#/dre"); } })
    ]));

    // KPIs — linha 2
    wrap.appendChild(el("div", { class: "kpi-grid" }, [
      UI.kpi("Adiantamentos (AKOS→MRD)", brl(d.adiantamento), {}),
      UI.kpi("Saldo de Nf-e (MRD)", brl(saldoNFeMRD), { sub: "conforme aba RESUMO da planilha", onclick: function () { go("#/processos"); } }),
      UI.kpi("Boletos vencidos", String(d.boletosVencidos), { kind: d.boletosVencidos ? "danger" : "muted", sub: brl(d.valorVencidos), onclick: function () { go("#/boletos?status=vencido"); } }),
      UI.kpi("Câmbio realizado", brl(camRealizado), { kind: camRealizado ? "ok" : "muted", sub: camRealCount + " de " + cam.length + " processos", onclick: function () { go("#/cambio"); } })
    ]));

    // recebimento por processo (barras)
    var rows = s().processos.map(function (p) { return Calc.resumoProc(s(), p); });
    var maxFat = Math.max.apply(null, rows.map(function (r) { return r.faturamento; }).concat([1]));
    var barList = el("div", { class: "bars" }, rows.map(function (r) {
      var pct = r.faturamento ? Math.round(r.recebido / r.faturamento * 100) : 0;
      return el("div", { class: "bar-row clickable", onclick: function () { go("#/processos/" + encodeURIComponent(r.processo.id)); } }, [
        el("div", { class: "bar-label" }, r.processo.id),
        el("div", { class: "bar-track", title: pct + "% recebido" }, [
          el("div", { class: "bar-fill", style: { width: Math.round(r.faturamento / maxFat * 100) + "%" } }),
          el("div", { class: "bar-fill bar-fill-rec", style: { width: Math.round(r.recebido / maxFat * 100) + "%" } })
        ]),
        el("div", { class: "bar-val" }, brl(r.faturamento)),
        el("div", { class: "bar-pct " + (pct >= 100 ? "ok" : pct > 0 ? "info" : "muted") }, pct + "%")
      ]);
    }));
    wrap.appendChild(UI.section("Faturamento × Recebimento por processo", barList));

    // ---- boletos vencidos (se houver) ----
    var venc = s().boletos.filter(function (b) { return Calc.statusBoleto(b) === "vencido"; }).sort(byVenc);
    if (venc.length) {
      wrap.appendChild(UI.section("⚠ Boletos vencidos (" + venc.length + ")", UI.table(boletoCols(true), venc, { dense: true, onRowClick: function (b) { abrirBoleto(b); } })));
    }
    return wrap;
  };

  /* ----------------------------- PROCESSOS ----------------------------- */
  Views.processos = function () {
    var wrap = el("div");
    var st = { busca: "" };

    var busca = el("input", { class: "inp", placeholder: "Buscar por processo, BL/AWB ou cliente…", oninput: function (e) { st.busca = e.target.value.toLowerCase().trim(); render(); } });
    var filtros = el("div", { class: "filters" }, [
      el("label", { class: "field" }, [el("span", { class: "field-label" }, "Buscar"), busca])
    ]);

    var cols = [
      { key: "id", label: "Processo", render: function (r) { return "<strong>" + esc(r.processo.id) + "</strong>"; } },
      { key: "bl", label: "BL/AWB", render: function (r) { return esc(r.processo.blAwb || "—"); } },
      { key: "abrir", label: "", align: "right", render: function () { return "<span class='link-mini'>abrir →</span>"; } }
    ];

    var head = el("h3", { class: "sub-title" }, "");
    var body = el("div");

    function render() {
      UI.clear(body);
      var rows = s().processos.map(function (p) { return { processo: p }; });
      if (st.busca) {
        rows = rows.filter(function (r) {
          var clientes = Calc.itensDoProc(s(), r.processo.id).map(function (i) { return i.cliente; }).filter(Boolean).join(" ");
          var hay = ((r.processo.id || "") + " " + (r.processo.blAwb || "") + " " + clientes).toLowerCase();
          return hay.indexOf(st.busca) >= 0;
        });
      }
      head.textContent = rows.length + " processo(s)";
      body.appendChild(UI.table(cols, rows, {
        onRowClick: function (r) { go("#/processos/" + encodeURIComponent(r.processo.id)); },
        emptyMsg: "Nenhum processo encontrado."
      }));
    }

    wrap.appendChild(UI.section("Processos de importação", el("div", null, [filtros, head, body]), [
      el("button", { class: "btn btn-primary", onclick: novoProcesso }, "+ Novo processo")
    ]));
    wrap.appendChild(el("p", { class: "hint" }, "Clique em um processo para ver todos os dados: faturamento, recebido, a receber, custos, boletos e câmbio."));
    render();
    return wrap;
  };

  Views.processoDetail = function (id) {
    var p = s().processos.filter(function (x) { return x.id === id; })[0];
    var wrap = el("div");
    if (!p) { wrap.appendChild(el("p", null, "Processo não encontrado.")); return wrap; }
    var r = Calc.resumoProc(s(), p);
    var cust = p.custo || {};

    wrap.appendChild(el("div", { class: "crumb" }, [
      el("a", { href: "#/processos" }, "← Processos"), el("span", null, " / " + p.id)
    ]));

    // KPIs do processo
    wrap.appendChild(el("div", { class: "kpi-grid" }, [
      UI.kpi("Faturamento", brl(r.faturamento), { kind: "primary" }),

        if (!p) { head.textContent = ""; body.appendChild(el("div", { class: "empty" }, "Processo não encontrado.")); return; }
        var its = Calc.itensDoProc(s(), p.id);
        if (st.busca) its = its.filter(function (it) { return (((it.cliente || "") + " " + (it.nfe || "")).toLowerCase().indexOf(st.busca) >= 0); });
        head.textContent = "Processo " + p.id + " · " + its.length + " NF-e";
        var procCols = GERAL_COLS.filter(function (c) { return c.lvl === "p"; });
        var itemCols = GERAL_COLS.filter(function (c) { return c.lvl === "it"; });
        body.appendChild(el("div", { class: "vert-block" }, [
          el("h4", { class: "vert-title" }, "Dados do processo"),
          kvVert(procCols, p),
          el("div", { class: "vert-actions" }, [el("a", { class: "link-mini", href: "#/processos/" + encodeURIComponent(p.id) }, "abrir processo completo →")])
        ]));
        its.forEach(function (it) {
          body.appendChild(el("div", { class: "vert-block" }, [
            el("h4", { class: "vert-title" }, "NF-e " + (it.nfe || "?") + (it.cliente ? " · " + it.cliente : "")),
            kvVert(itemCols, it)
          ]));
        });
        if (!its.length) body.appendChild(el("div", { class: "empty" }, "Este processo ainda não tem NF-e cadastrada."));
        return;
      }

      // ---- vista TABELA (todos) ----
      var rows = [];
      s().processos.forEach(function (p) {
        var its = Calc.itensDoProc(s(), p.id);
        if (st.busca) {
          its = its.filter(function (it) {
            var hay = ((it && it.cliente) || "") + " " + ((it && it.nfe) || "");
            return hay.toLowerCase().indexOf(st.busca) >= 0;
          });
          if (!its.length) return;
        }
        if (!its.length) its = [null];
        its.forEach(function (it, idx) { rows.push({ p: p, it: it, first: idx === 0 }); });
      });

      function total(c) {
        if (c.lvl === "it") return rows.reduce(function (a, r) { return a + (r.it ? Calc.n(r.it[c.f]) : 0); }, 0);
        return rows.filter(function (r) { return r.first; }).reduce(function (a, r) { return a + Calc.n(r.p[c.f]); }, 0);
      }
      var foot = el("tr", { class: "foot" }, GERAL_COLS.map(function (c, i) {
        if (i === 0) return el("td", null, "TOTAL");
        if (c.tot) { var tv = total(c); return el("td", { class: "t-right" + (tv < 0 ? " neg" : "") }, brl(tv)); }
        return el("td", null, "");
      }));

      var nProc = rows.filter(function (r) { return r.first; }).length;
      head.textContent = rows.length + " linha(s) · " + nProc + " processo(s) — selecione um processo acima para ver os detalhes organizados";
      body.appendChild(el("div", { class: "scroll-x" }, UI.table(cols, rows, {
        dense: true, footer: foot, emptyMsg: "Nenhuma linha para o filtro selecionado.",

      })));
    }
    render();
    return wrap;
  };

      var vi = el("input", { class: "inp t-right", type: "text", inputmode: "decimal", placeholder: "valor", value: (r.value != null ? Fmt.money(r.value) : "") });
      var v2 = el("input", { class: "inp t-right", type: "text", inputmode: "decimal", placeholder: "% (opc.)", value: (r.value2 != null ? Fmt.num(r.value2 * (r.value2 < 1 ? 100 : 1), 2) : "") });

  /* ---- Importar NF a partir do PDF (DANFE) ---- */
  function importarNfPDF() {
    var inp = el("input", { type: "file", accept: "application/pdf,.pdf", style: { display: "none" } });
    inp.addEventListener("change", function () {
      var file = inp.files && inp.files[0];
      if (!file) return;
      UI.toast("Lendo o PDF…");
      window.NFPDF.fromFile(file).then(function (d) {
        revisarNfImportada(d, file.name);
      }).catch(function (e) {
        UI.toast("Não consegui ler o PDF: " + (e && e.message ? e.message : e), "danger");
      });
    });
    document.body.appendChild(inp); inp.click();
    setTimeout(function () { inp.remove(); }, 1000);
  }

  // mostra o que foi extraído para o usuário conferir/corrigir antes de salvar
  function revisarNfImportada(d, fileName) {
    var achou = [];
    if (d.numero) achou.push("nº " + d.numero);
    if (d.valorNF != null) achou.push("valor da NF");
    if (d.valorProduto != null) achou.push("produtos");
    if (d.ncms && d.ncms.length) achou.push(d.ncms.length + " NCM");

    var tipoSel = el("select", { class: "inp" }, [
      el("option", { value: "saida" }, "NF de Saída (emitida pela AKOS)"),
      el("option", { value: "entrada" }, "NF de Entrada (emitida pela MRD)")
    ]);
    var procSel = el("select", { class: "inp" }, [el("option", { value: "" }, "— selecione —")].concat(
      procOpts().map(function (id) { return el("option", { value: id }, id); })
    ));

    var f = UI.form([
      { key: "numero", label: "Nº da NF", type: "text" },
      { key: "emissao", label: "Emissão", type: "date" },
      { key: "parceiro", label: "Destinatário / Cliente", type: "text", wide: true },
      { key: "valorProduto", label: "Valor dos produtos", type: "money" },
      { key: "valorNF", label: "Valor total da NF", type: "money" },
      { key: "ipi", label: "IPI", type: "money" },
      { key: "icms", label: "ICMS", type: "money" },
      { key: "pis", label: "PIS", type: "money" },
      { key: "cofins", label: "COFINS", type: "money" },
      { key: "ncm", label: "NCM(s)", type: "text", wide: true },
      { key: "chave", label: "Chave de acesso", type: "text", wide: true }
    ], {
      numero: d.numero, emissao: d.emissao, parceiro: d.destinatario,
      valorProduto: d.valorProduto, valorNF: d.valorNF, ipi: d.ipi, icms: d.icms,
      pis: d.pis, cofins: d.cofins, ncm: d.ncm, chave: d.chave
    });

    var body = el("div", null, [
      el("div", { class: "imp-info" }, [
        el("strong", null, "Arquivo: "), fileName || "PDF",
        el("br"), (achou.length ? ("Encontrei automaticamente: " + achou.join(", ") + ".") : "Não consegui identificar os campos automaticamente."),
        el("br"), el("span", { class: "muted" }, "Confira e corrija o que precisar antes de salvar.")
      ]),
      el("div", { class: "form-grid" }, [
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Tipo da nota"), tipoSel]),
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Processo"), procSel])
      ]),
      f.node,
      el("details", { class: "raw-details" }, [
        el("summary", null, "Ver texto lido do PDF (para conferência)"),
        el("pre", { class: "raw-pdf" }, (d.rawText || "").substring(0, 4000))
      ])
    ]);

    UI.modal("Importar NF do PDF", body, {
      wide: true,
      buttons: [
        { label: "Cancelar", kind: "ghost" },
        { label: "Salvar nota", kind: "primary", onClick: function () {
            var v = f.read();
            var rec = {
              processoId: procSel.value || null,
              numero: v.numero, emissao: v.emissao,
              valorProduto: v.valorProduto, ipi: v.ipi, icms: v.icms, pis: v.pis,
              ncm: v.ncm, chave: v.chave
            };
            if (tipoSel.value === "saida") {
              rec.destinatario = v.parceiro; rec.valorNF = v.valorNF; rec.cofins = v.cofins;
              Store.add("nfEmitidas", rec);
            } else {
              rec.cliente = v.parceiro; rec.valorTotal = v.valorNF;
              Store.add("nfEntrada", rec);
            }
            UI.toast("Nota importada e salva."); rerender();
          } }
      ]
    });
  }

  function restaurar() {
    var inp = el("input", { type: "file", accept: ".json,application/json", style: { display: "none" } });
    inp.addEventListener("change", function () {
      var file = inp.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          Store.importJSON(reader.result).then(function () { UI.toast("Backup restaurado."); rerender(); });
        } catch (e) { UI.toast("Falha: " + e.message, "danger"); }
      };
      reader.readAsText(file);
    });
    document.body.appendChild(inp); inp.click(); setTimeout(function () { inp.remove(); }, 1000);
  }

  function rerender() { if (window.App && window.App.render) window.App.render(); }

  window.Views = Views;
})();

</script>
<script>
/* app.js — inicialização e roteamento */
(function () {
  "use strict";
  var UI = window.UI, el = window.UI.el;

  var NAV = [
    { id: "dashboard", label: "Painel", icon: "▣" },
    { id: "boletos", label: "Boletos", icon: "₵" },
    { id: "notas", label: "Notas Fiscais", icon: "🧾" },
    { id: "cambio", label: "Câmbio", icon: "⇄" },
    { id: "geral", label: "Processos - Geral", icon: "▦" },
    { id: "dre", label: "DRE", icon: "∑" },
    { id: "fluxo", label: "Fluxo de Caixa", icon: "≈" },
    { id: "clientes", label: "Clientes", icon: "☻" },
    { id: "historico", label: "Histórico", icon: "🕓" },
    { id: "backup", label: "Dados / Backup", icon: "⛁" }
  ];

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "");
    var qIdx = h.indexOf("?");
    var query = {};
    if (qIdx >= 0) {
      h.substring(qIdx + 1).split("&").forEach(function (kv) {
        var p = kv.split("="); query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
      });
      h = h.substring(0, qIdx);
    }
    var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
    return { route: parts[0] || "dashboard", param: parts[1], query: query };
  }

  var titles = {
    dashboard: "Painel de Controle", processos: "Processos de Importação", boletos: "Contas a Receber — Boletos",
    notas: "Notas Fiscais", cambio: "Controle de Câmbio", geral: "Processos - Geral", dre: "DRE", fluxo: "Fluxo de Caixa",
    clientes: "Clientes", historico: "Histórico de Alterações", backup: "Dados e Backup"
  };

  var App = {
    render: function () {
      var r = parseHash();
      // nav ativo
      Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (a) {
        a.classList.toggle("active", a.dataset.route === r.route);
      });
      var title = titles[r.route] || "—";
      if (r.route === "processos" && r.param) title = "Processo " + r.param;
      document.getElementById("page-title").textContent = title;

      var view;
      try {
        var V = window.Views;
        if (r.route === "processos" && r.param) view = V.processoDetail(r.param);
        else if (V[r.route]) view = V[r.route](r.query);
        else view = el("p", null, "Página não encontrada.");
      } catch (e) {
        view = el("div", { class: "error-box" }, ["Erro ao renderizar: ", el("pre", null, String(e && e.stack || e))]);
        console.error(e);
      }
      var main = document.getElementById("view");
      UI.clear(main);
      main.appendChild(view);
      UI.colorNegatives(main);
      main.scrollTop = 0;
    },

    init: function () {
      // sidebar
      var nav = document.getElementById("nav");
      NAV.forEach(function (n) {
        nav.appendChild(el("a", { class: "nav-item", href: "#/" + n.id, dataset: { route: n.id } }, [
          el("span", { class: "nav-icon" }, n.icon), el("span", { class: "nav-text" }, n.label)
        ]));
      });

      var btnSync = document.getElementById("btn-sync");
      if (btnSync) btnSync.addEventListener("click", function () {
        if (!window.Sync || !window.Sync.available) { UI.toast("Sincronização indisponível. Abra o sistema pelo 'Iniciar Sistema.bat'.", "warn"); return; }
        UI.confirmar("Recarregar TODOS os dados a partir das planilhas da pasta? A planilha é a fonte oficial; um backup automático é guardado antes.", function () {
          window.Sync.manual();
        }, { okLabel: "Sincronizar agora" });
      });

      var cloud = !!(window.SB && window.SB.configured);
      // botão de sair (nuvem)
      // sem login: esconde o botão de sair
      var btnLogout = document.getElementById("btn-logout");
      if (btnLogout) btnLogout.style.display = "none";
      // no modo nuvem, esconde o botão de sincronizar (planilha deixa de ser a fonte)
      if (cloud && btnSync) btnSync.style.display = "none";

      // menu lateral no celular (hambúrguer)
      var btnMenu = document.getElementById("btn-menu");
      var backdrop = document.getElementById("sidebar-backdrop");
      function closeMenu() { document.body.classList.remove("menu-open"); }
      if (btnMenu) btnMenu.addEventListener("click", function () { document.body.classList.toggle("menu-open"); });
      if (backdrop) backdrop.addEventListener("click", closeMenu);
      document.getElementById("nav").addEventListener("click", function (e) { if (e.target.closest(".nav-item")) closeMenu(); });

      window.addEventListener("hashchange", App.render);
      document.addEventListener("store:saved", function () {
        var s = document.getElementById("save-status");
        if (s) { s.textContent = "✔ salvo"; s.classList.add("show"); setTimeout(function () { s.classList.remove("show"); }, 1500); }
      });
      document.addEventListener("store:save-error", function () { UI.toast("Erro ao salvar na nuvem. Verifique sua conexão.", "danger"); });

      // acesso livre (sem login): entra direto no sistema
      App.boot();
    },

    boot: function () {
      if (App._booted) return; App._booted = true;
      var pre = (window.SB && window.SB.configured)
        ? window.SB.userEmail().then(function (email) {
            var nome = "";
            try { nome = (localStorage.getItem("akos_user_name") || "").trim(); } catch (e) {}
            var quem = nome || email || "usuário";
            Store.setUser(quem); App._userEmail = quem;
          }).catch(function () { })
        : Promise.resolve();
      pre.then(function () { return window.Store.init(); }).then(function () {
        var emp = window.Store.state.empresa || {};
        var sub = document.getElementById("brand-sub");
        if (sub) sub.textContent = (emp.importadora || "MRD") + " × " + (emp.adquirente || "AKOS");
        var who = document.getElementById("user-email");
        if (who && App._userEmail) who.textContent = App._userEmail;
        if (!location.hash) location.hash = "#/dashboard";
        App.render();
        if (Store.isCloud()) {
          // backup/histórico só quando houver sessão autenticada (a planilha/sync cuida disso)
          window.SB.getSession().then(function (sess) {
            if (sess) { Store.startBackupTimer(); Store.log("Entrou no sistema", null); }
          });
        } else if (window.Sync) { window.Sync.init(); }
      }).catch(function (e) {
        var v = document.getElementById("view");
        if (v) v.appendChild(el("div", { class: "error-box" }, "Falha ao carregar dados: " + (e && e.message ? e.message : e)));
        console.error(e);
      });
    },

    showLogin: function () {
      var ov = document.getElementById("login-overlay");
      if (ov) { ov.style.display = "flex"; return; }
      ov = el("div", { id: "login-overlay", class: "login-overlay" });
      var nome = el("input", { class: "inp", type: "text", placeholder: "seu nome", autocomplete: "name", value: (localStorage.getItem("akos_user_name") || "") });
      var pw = el("input", { class: "inp", type: "password", placeholder: "senha de acesso", autocomplete: "current-password" });
      var msg = el("div", { class: "login-msg" });
      var btn = el("button", { class: "btn btn-primary btn-block" }, "Entrar");
      function entrar() {
        msg.textContent = ""; btn.disabled = true; btn.textContent = "Entrando…";
        try { localStorage.setItem("akos_user_name", (nome.value || "").trim()); } catch (e) {}
        window.SB.signInShared(pw.value || "").then(function (r) {
          btn.disabled = false; btn.textContent = "Entrar";
          if (r.error) { msg.textContent = "Senha incorreta."; }
        }).catch(function () { btn.disabled = false; btn.textContent = "Entrar"; msg.textContent = "Falha ao entrar. Tente de novo."; });
      }
      btn.addEventListener("click", entrar);
      pw.addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
      ov.appendChild(el("div", { class: "login-card" }, [
        el("div", { class: "login-brand" }, [
          el("span", { class: "login-mark" }, "AKOS"), el("span", { class: "login-mark2" }, "Trading")
        ]),
        el("h2", null, "Controle Financeiro"),
        el("p", { class: "login-sub" }, "Digite a senha de acesso para entrar."),
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Seu nome (aparece no histórico)"), nome]),
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Senha de acesso"), pw]),
        msg, btn
      ]));
      document.body.appendChild(ov);
      setTimeout(function () { pw.focus(); }, 50);
    },
    hideLogin: function () {
      var ov = document.getElementById("login-overlay");
      if (ov) ov.style.display = "none";
    }
  };

  window.App = App;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", App.init);
  else App.init();
})();

</script>
</body>
</html>
