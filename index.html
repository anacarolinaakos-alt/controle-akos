<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro AKOS × MRD</title>
<meta name="description" content="Sistema de controle financeiro de importação por conta e ordem — AKOS × MRD.">
<meta property="og:type" content="website">
<meta property="og:title" content="Controle Financeiro AKOS × MRD">
<meta property="og:description" content="Sistema de controle financeiro de importação por conta e ordem.">

<style>
/* MRD — Controle Financeiro de Importação | estilo */
:root {
  --bg: #0f1720; --panel: #ffffff; --ink: #172033; --muted: #6b7785; --line: #e6ebf2;
  --brand: #0b5fff; --brand-d: #0846c2; --ok: #0f9d58; --warn: #d18700; --danger: #e5484d; --info: #1170c4;
  --soft: #f4f6f9; --soft2: #eef2f7;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.05);
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink); background: var(--soft); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

/* sidebar */
.sidebar { background: #0e1b2e; color: #cdd7e4; display: flex; flex-direction: column; }
.brand { padding: 16px 16px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-logo { display: block; text-decoration: none; margin-bottom: 13px; transition: opacity .15s ease; }
.brand-logo:hover { opacity: .85; }
.brand-img { width: 180px; max-width: 100%; height: auto; display: block; }
.brand-mark { width: 20px; height: 29px; flex: none; }
.brand-word { display: inline-flex; align-items: baseline; line-height: 1; }
.brand-word b { color: #3f3f3f; font-weight: 800; font-size: 19px; letter-spacing: -.3px; }
.brand-word .tr { color: #6f6f6f; font-weight: 400; font-size: 15px; margin-left: 3px; }
.brand-title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .2px; }
.brand-title small { display: block; font-weight: 400; font-size: 11px; color: #8ea4c0; margin-top: 2px; }
#brand-sub { display: block; margin-top: 6px; font-size: 12px; color: #6fa8ff; font-weight: 600; }
nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; color: #c0cee0; text-decoration: none; border-radius: 8px; font-size: 13.5px; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--brand); color: #fff; font-weight: 600; }
.nav-icon { width: 18px; text-align: center; opacity: .9; }
.sidebar-foot { padding: 12px 16px; font-size: 11px; color: #6b7d96; border-top: 1px solid rgba(255,255,255,.08); }

/* main */
.main { display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(16,24,40,.03); z-index: 2; }
#page-title { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.2px; }
.topbar-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
#save-status { opacity: 0; transition: opacity .2s; color: var(--ok); font-weight: 600; }
#save-status.show { opacity: 1; }
#view { padding: 22px 24px 60px; overflow-y: auto; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: .2px; }
.card-actions { display: flex; gap: 8px; }
.card > table, .card > div { }
.card .grid, .card > .form-grid, .card .info-grid, .card .bars, .card .filters, .card .btn-row, .card .hint { margin: 0; }
.card > div { padding: 0; }
.card .info-grid, .card .bars, .card .filters, .card > .form-grid { padding: 16px 18px; }
.card .hint { padding: 0 18px 16px; }

/* KPIs */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.kpi.clickable { cursor: pointer; transition: transform .1s ease, box-shadow .15s ease; }
.kpi.clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,24,40,.10); }
.kpi-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.kpi-value { font-size: 24px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpi-primary { border-left-color: var(--brand); } .kpi-ok { border-left-color: var(--ok); }
.kpi-info { border-left-color: var(--info); } .kpi-warn { border-left-color: var(--warn); }
.kpi-danger { border-left-color: var(--danger); }
.kpi-danger .kpi-value { color: var(--danger); } .kpi-warn .kpi-value { color: var(--warn); }
.dash-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.dash-strip-item { flex: 1; min-width: 130px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 15px; display: flex; flex-direction: column; gap: 3px; box-shadow: var(--shadow); }
.ds-k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
.ds-v { font-size: 19px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.ds-v.neg { color: var(--danger); }

/* tables */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th { text-align: left; padding: 11px 14px; background: var(--soft); color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
table.grid td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid.dense td, table.grid.dense th { padding: 8px 12px; }
table.grid tbody tr:nth-child(even) { background: #fafbfd; }
table.grid tbody tr:hover { background: #eef4ff; }
table.grid tr.clickable { cursor: pointer; }
table.grid tr.clickable:hover { background: #e8f1ff; }
table.grid tr.foot td, table.grid tfoot td { font-weight: 700; background: var(--soft2); border-top: 2px solid var(--line); }
.t-right { text-align: right; } .t-center { text-align: center; }
td.t-right, table.grid th.t-right { text-align: right; font-variant-numeric: tabular-nums; }
table.grid th.t-center { text-align: center; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* DRE table */
table.dre td:first-child { width: 70%; }
table.dre tr.h td { background: var(--soft); font-weight: 700; text-transform: uppercase; font-size: 12px; color: var(--muted); }
table.dre tr.sub td { font-weight: 600; background: #fafbfd; }
table.dre tr.total td { font-weight: 800; font-size: 15px; background: #eef5ff; color: var(--brand-d); border-top: 2px solid var(--brand); }
table.dre tr.pct-row td { color: var(--muted); font-style: italic; }

/* info grid */
.info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 18px; }
.info-item { display: flex; flex-direction: column; }
.info-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
.info-value { font-weight: 600; }

/* bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 80px 1fr 130px 46px; align-items: center; gap: 12px; padding: 4px 0; border-radius: 6px; }
.bar-row.clickable { cursor: pointer; } .bar-row.clickable:hover { background: #f8fafc; }
.bar-label { font-weight: 600; font-size: 13px; }
.bar-track { position: relative; height: 20px; background: var(--soft2); border-radius: 5px; overflow: hidden; }
.bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: #c7d7f5; border-radius: 5px; }
.bar-fill-rec { background: var(--ok); opacity: .85; }
.a-bars { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; }
.a-bar { display: grid; grid-template-columns: 90px 1fr 140px; align-items: center; gap: 12px; }
.a-bar .bar-fill { background: var(--brand); opacity: .8; }
.a-bar-2 .bar-fill { background: var(--ok); opacity: .8; }
.mini-track { height: 10px; background: var(--soft2); border-radius: 5px; overflow: hidden; min-width: 80px; }
.mini-fill { height: 100%; background: var(--brand); opacity: .75; border-radius: 5px; }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.bar-pct { text-align: right; font-weight: 700; font-size: 12px; }

/* badges */
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; line-height: 1.6; }
.badge-ok { background: #e3f6ea; color: var(--ok); } .badge-danger { background: #fde6e6; color: var(--danger); }
.badge-warn { background: #fdf0dc; color: var(--warn); } .badge-info { background: #e2eefb; color: var(--info); }
.badge-muted { background: var(--soft2); color: var(--muted); }

/* buttons */
.btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--soft); }
.btn { transition: background .12s ease, box-shadow .12s ease, transform .06s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(11,95,255,.35); } .btn-primary:hover { background: var(--brand-d); }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; } .btn-ok:hover { filter: brightness(.95); }
.btn-danger { background: #fff; border-color: var(--danger); color: var(--danger); } .btn-danger:hover { background: #fde6e6; }
.btn-ghost { background: transparent; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* filters / forms */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; border-bottom: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
.field-help { font-size: 11px; color: var(--muted); }
.inp { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; min-width: 150px; background: #fff; }
.inp:focus { outline: 2px solid #bcd3ff; border-color: var(--brand); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field-wide { grid-column: 1 / -1; }

/* modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,32,.5); display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 100; overflow-y: auto; }
.modal { background: #fff; border-radius: 12px; width: 560px; max-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal-wide { width: 820px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-x { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 18px 20px; }
.modal-sub { margin: 18px 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; border-top: 1px solid var(--line); padding-top: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--soft); border-radius: 0 0 12px 12px; }
.modal-body .info-grid { grid-template-columns: repeat(2, 1fr); margin-bottom: 6px; }

/* toasts */
#toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { padding: 11px 16px; border-radius: 8px; color: #fff; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: all .25s; }
.toast.show { opacity: 1; transform: none; }
.toast-ok { background: var(--ok); } .toast-warn { background: var(--warn); } .toast-danger { background: var(--danger); }

/* blocos de custo de importação (detalhe do processo) */
.custo-grid { columns: 2; column-gap: 18px; padding: 18px; }
.custo-block { break-inside: avoid; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 9px; background: #fff; overflow: hidden; }
.custo-block .sub-title { margin: 0; padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .5px; }
.custo-block table.grid.dre { font-size: 13px; }
.custo-block table.grid.dre td { padding: 8px 14px; border-bottom: 1px solid #eef2f7; }
.custo-block table.grid.dre tr:last-child td { border-bottom: none; }
.custo-block table.grid.dre td:first-child { width: 62%; color: var(--ink); }
.custo-block table.grid.dre td.t-right { font-variant-numeric: tabular-nums; }
.custo-block table.grid.dre tr.sub td { font-weight: 700; background: #eef5ff; color: var(--brand-d); border-top: 1px solid #d7e3f5; }
.custo-block table.grid.dre tr:hover td { background: transparent; }
.custo-block table.grid.dre tr.sub:hover td { background: #eef5ff; }
.raw-details { margin: 6px 18px 16px; border-top: 1px solid var(--line); padding-top: 10px; }
.raw-details summary { cursor: pointer; color: var(--brand); font-weight: 600; font-size: 13px; }
.raw-details table { margin-top: 10px; }
@media (max-width: 900px) { .custo-grid { columns: 1; } }

/* importação de NF por PDF */
.imp-info { background: #eef5ff; border: 1px solid #d7e3f5; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.6; }
.raw-pdf { max-height: 220px; overflow: auto; background: var(--soft); border-radius: 6px; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-word; }

/* cabeçalho de subseção com botão (Notas Fiscais) */
.sub-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 18px 8px; }
.sub-head .sub-title { margin: 0; }

/* editor da DRE */
.dre-edit-head, .dre-edit-row { display: grid; grid-template-columns: 1fr 140px 110px 38px 38px; gap: 8px; align-items: center; }
.dre-edit-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; padding: 0 2px 6px; }
.dre-edit-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.dre-edit-row .inp { min-width: 0; }

/* formulário editável de custos */
.cust-form { display: flex; flex-direction: column; gap: 6px; }
.cust-sec { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
.cust-sec-title { margin: 0 0 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-weight: 800; }
.cust-form .form-grid { grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.cust-form .inp { min-width: 0; }
.calc-line { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 8px 12px; background: #eef5ff; border-radius: 7px; font-weight: 700; color: var(--brand-d); }
.calc-val { font-variant-numeric: tabular-nums; }
.desp-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.desp-row { display: grid; grid-template-columns: 1fr 160px 38px; gap: 8px; align-items: center; }

/* blocos de conferência da DRE (Comissão a pagar / Lucro AKOS / Saldo de NF-e) */
.conf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.conf-grid .card { margin-bottom: 0; }
@media (max-width: 980px) { .conf-grid { grid-template-columns: 1fr; } }

/* Processos - Geral: vista vertical (ficha do processo) */
.vert-block { border: 1px solid var(--line); border-radius: 9px; margin: 0 18px 14px; overflow: hidden; }
.vert-title { margin: 0; padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; color: var(--ink); }
.kv-vert { display: flex; flex-direction: column; }
.kv-vrow { display: flex; justify-content: space-between; gap: 16px; padding: 8px 14px; border-bottom: 1px solid #eef2f7; font-size: 13px; }
.kv-vrow:last-child { border-bottom: none; }
.kv-vrow:nth-child(even) { background: #fcfdfe; }
.kv-k { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .3px; }
.kv-v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.vert-actions { padding: 10px 14px; border-top: 1px solid var(--line); }

/* tabela larga com rolagem horizontal (Processos - Geral) */
.scroll-x { overflow-x: auto; }
.scroll-x table.grid td, .scroll-x table.grid th { white-space: nowrap; }
.scroll-x table.grid th { position: static; font-weight: 800; color: var(--ink); font-size: 12px; }

.sub-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin: 16px 18px 8px; }
.card .sub-title:first-child { margin-top: 14px; }

/* tela de login (nuvem) */
.login-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #0e1b2e 0%, #16406e 100%); }
.login-card { background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 30px 30px 26px; width: 380px; max-width: 100%; }
.login-brand { display: flex; align-items: baseline; gap: 4px; margin-bottom: 18px; }
.login-mark { font-weight: 800; font-size: 22px; color: #17406b; letter-spacing: -.5px; }
.login-mark2 { font-weight: 400; font-size: 18px; color: #6f6f6f; }
.login-card h2 { margin: 0 0 4px; font-size: 20px; }
.login-sub { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
.login-card .field { margin-bottom: 14px; }
.login-card .inp { width: 100%; min-width: 0; }
.login-msg { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; font-weight: 600; }
.btn-block { width: 100%; padding: 11px; font-size: 14px; }

/* painel — 2 colunas e legenda das barras */
.dash-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.dash-2col .card { margin-bottom: 20px; }
@media (max-width: 980px) { .dash-2col { grid-template-columns: 1fr; } }
a.link-mini { text-decoration: none; }
a.link-mini:hover { text-decoration: underline; }
.bar-legend { display: flex; gap: 18px; padding: 12px 18px 0; font-size: 12px; color: var(--muted); }
.bar-legend .lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
.bar-legend .lg-fat { background: #c7d7f5; }
.bar-legend .lg-rec { background: var(--ok); }

/* banner de sincronização */
#sync-banner:empty { display: none; }
.sync-banner { display: flex; align-items: center; gap: 12px; background: #fff7e6; border-bottom: 1px solid #f0d9a8; color: #7a5b12; padding: 11px 24px; font-size: 13.5px; }
.sync-banner .sync-ic { font-size: 16px; }
.sync-banner .sync-msg { flex: 1; font-weight: 600; }
.sync-banner .sync-actions { display: flex; gap: 8px; }
.sync-banner.sync-warn { background: #fde6e6; border-bottom-color: #f0b8b8; color: #a12626; }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }

/* misc */
.crumb { margin-bottom: 14px; font-size: 13px; } .crumb a { color: var(--brand); text-decoration: none; } .crumb a:hover { text-decoration: underline; }
.hint { color: var(--muted); font-size: 12.5px; }
.neg { color: var(--danger); font-weight: 600; } .warn-text { color: var(--warn); font-weight: 600; }
.pend { color: var(--warn); font-weight: 600; }
.alert-vencidos { background: #fde6e6; color: var(--danger); border: 1px solid #f5b5b5; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; cursor: pointer; }
.vinc-tag { display: inline-block; background: #eef2ff; color: #3b53c4; border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 600; margin-left: 4px; white-space: nowrap; }
.muted { color: var(--muted); } .ok { color: var(--ok); } .info { color: var(--info); }
.link-mini { color: var(--brand); font-weight: 600; font-size: 12px; }
.error-box { background: #fde6e6; border: 1px solid var(--danger); color: var(--danger); padding: 14px; border-radius: 8px; }
.error-box pre { white-space: pre-wrap; font-size: 12px; }

/* topbar: botão de menu (só no celular) e e-mail do usuário */
.btn-menu { display: none; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 18px; line-height: 1; padding: 6px 10px; cursor: pointer; margin-right: 10px; }
.topbar h1 { flex: 1; }
.user-email { font-size: 12px; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }

@media (max-width: 1100px) { .kpi-grid, .info-grid { grid-template-columns: repeat(2, 1fr); } }

/* ---------- CELULAR / TELAS PEQUENAS ---------- */
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .btn-menu { display: inline-block; }
  /* menu vira gaveta deslizante */
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 250px; z-index: 50; transform: translateX(-100%); transition: transform .22s ease; }
  body.menu-open .sidebar { transform: translateX(0); }
  body.menu-open .sidebar-backdrop { display: block; }
  .topbar { padding: 12px 14px; }
  #page-title { font-size: 16px; }
  #view { padding: 14px 12px 60px; }
  .kpi-grid, .info-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid { grid-template-columns: 1fr; }
  .card-head { flex-wrap: wrap; gap: 8px; }
  .card-actions { flex-wrap: wrap; }
  .filters { gap: 8px; }
  .filters .inp, .inp { min-width: 0; width: 100%; }
  .field { width: 100%; }
  /* toda tabela ganha rolagem lateral no celular */
  .card > table.grid, .card table.grid { display: block; overflow-x: auto; white-space: nowrap; }
  .modal, .modal-wide { width: 100%; }
  .modal-overlay { padding: 12px; }
  .user-email { display: none; }
  .bar-row { grid-template-columns: 56px 1fr 84px 34px; gap: 6px; }
  .bar-val { font-size: 11px; }
}
@media (max-width: 600px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .info-grid { grid-template-columns: 1fr 1fr; }
  .card-actions .btn { font-size: 12px; padding: 7px 10px; }
}

</style>

  var SB = {

    onAuthChange: function (cb) {

    // carrega o "estado" (todos os dados) da nuvem

    // ---- backups automáticos ----

      return client().from("app_backups").insert({ autor: autor || null, data: data })

    listBackups: function (limite) {
      return client().from("app_backups").select("id, created_at, autor").order("created_at", { ascending: false }).limit(limite || 30)

    },
    getBackup: function (id) {

  };

  window.SB = SB;
})();

<script>
/* format.js — utilitários de formatação (pt-BR) */
(function () {
  "use strict";

  function isNum(v) { return typeof v === "number" && isFinite(v); }

  var Fmt = {
    brl: function (v) {
      if (v === null || v === undefined || v === "" || !isNum(Number(v))) return "—";
      return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    },
    // valor monetário sem o símbolo (para tabelas densas)
    money: function (v) {
      if (v === null || v === undefined || v === "" || !isNum(Number(v))) return "—";
      return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },
    num: function (v, dec) {
      if (v === null || v === undefined || v === "" || isNaN(Number(v))) return "—";
      dec = dec == null ? 2 : dec;
      return Number(v).toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    },
    pct: function (v, dec) {
      if (v === null || v === undefined || isNaN(Number(v))) return "—";
      dec = dec == null ? 2 : dec;
      return (Number(v) * 100).toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + "%";
    },
    // ISO (yyyy-mm-dd) -> dd/mm/yyyy
    date: function (iso) {
      if (!iso) return "—";
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
      if (m) return m[3] + "/" + m[2] + "/" + m[1];
      return iso;
    },
    // ISO -> yyyy-mm-dd (para <input type=date>)
    dateInput: function (iso) {
      if (!iso) return "";
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
      return m ? m[0] : "";
    },
    today: function () {
      var d = new Date();
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      var dd = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + mm + "-" + dd;
    },
    // "1.234,56" / "1234.56" / "R$ 1.234,56" -> number
    parseNum: function (s) {
      if (s === null || s === undefined) return null;
      if (typeof s === "number") return s;
      s = String(s).trim();
      if (s === "") return null;
      s = s.replace(/[R$\s]/g, "");
      // remove separador de milhar (.) e troca decimal (,) por .
      if (s.indexOf(",") >= 0) {
        s = s.replace(/\./g, "").replace(",", ".");
      }
      var n = parseFloat(s);
      return isFinite(n) ? n : null;
    },
    diasAte: function (iso) {
      if (!iso) return null;
      var hoje = new Date(Fmt.today() + "T00:00:00");
      var d = new Date(iso.substring(0, 10) + "T00:00:00");
      return Math.round((d - hoje) / 86400000);
    }
  };

  window.Fmt = Fmt;
})();

</script>
<script>
/* store.js — persistência local (IndexedDB) + estado em memória */
(function () {
  "use strict";

  var DB_NAME = "mrd_sistema";
  var STORE = "kv";
  var KEY = "state";
  var SCHEMA_VERSION = 1;

  function openDB() {
    return new Promise(function (resolve, reject) {
      if (typeof indexedDB === "undefined" || !indexedDB) { reject(new Error("IndexedDB indisponível")); return; }
      var done = false;
      var to = setTimeout(function () { if (!done) { done = true; reject(new Error("IndexedDB timeout")); } }, 3000);
      var req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { clearTimeout(to); reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { if (done) return; done = true; clearTimeout(to); resolve(req.result); };
      req.onerror = function () { if (done) return; done = true; clearTimeout(to); reject(req.error); };
      req.onblocked = function () { if (done) return; done = true; clearTimeout(to); reject(new Error("IndexedDB bloqueado")); };
    });
  }

  // camada de persistência com fallback: IndexedDB -> localStorage -> memória
  var BACKEND = "indexeddb"; // detectado em runtime
  var LS_KEY = "mrd_sistema_state";

  function idbGet(key) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, "readonly");
        var r = tx.objectStore(STORE).get(key);
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function idbSet(key, val) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(val, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  // get/set genéricos com fallback automático
  function backendGet(key) {
    return idbGet(key).catch(function () {
      BACKEND = tryLocalStorage() ? "localstorage" : "memoria";
      return lsGet(key);
    });
  }
  function backendSet(key, val) {
    if (BACKEND === "indexeddb") {
      return idbSet(key, val).catch(function () {
        BACKEND = tryLocalStorage() ? "localstorage" : "memoria";
        warnBackend();
        return lsSet(key, val);
      });
    }
    return Promise.resolve(lsSet(key, val));
  }
  function tryLocalStorage() {
    try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (e) { return false; }
  }
  function lsName(key) { return "mrd_sistema_" + key; }
  function lsGet(key) { try { var v = localStorage.getItem(lsName(key)); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(key, val) { try { localStorage.setItem(lsName(key), JSON.stringify(val)); return true; } catch (e) { return false; } }
  var _warned = false;
  function warnBackend() {
    if (_warned) return; _warned = true;
    document.dispatchEvent(new CustomEvent("store:backend-warn", { detail: { backend: BACKEND } }));
  }

  var _idCounter = 1;
  function newId(prefix) {
    return (prefix || "r") + "_" + Date.now().toString(36) + "_" + (_idCounter++).toString(36);
  }

  function ensureIds(state) {
    ["processos", "itens", "boletos", "cambio", "clientes", "nfEmitidas", "nfEntrada"].forEach(function (coll) {
      if (!Array.isArray(state[coll])) state[coll] = [];
      state[coll].forEach(function (rec) {
        if (!rec._id) rec._id = newId(coll.substring(0, 3));
      });
    });
    if (!state.empresa) state.empresa = { adquirente: "AKOS", importadora: "MRD", comissaoPct: 0.05, taxaAdmPadrao: 3000 };
    if (!state.schemaVersion) state.schemaVersion = SCHEMA_VERSION;
    return state;
  }

  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  // ---- log de alterações ----
  var COLL_LABEL = {
    processos: "processo", itens: "NF-e/cliente", boletos: "boleto", cambio: "câmbio",
    clientes: "cliente", nfEmitidas: "NF de saída", nfEntrada: "NF de entrada"
  };
  function descRec(coll, rec) {
    if (!rec) return "";
    if (coll === "processos") return rec.id || "";
    if (coll === "boletos") return [rec.nfParcela, rec.cliente].filter(Boolean).join(" · ");
    if (coll === "itens") return ["NF " + (rec.nfe || ""), rec.cliente].filter(Boolean).join(" · ");
    if (coll === "cambio") return rec.processoId || "";
    if (coll === "clientes") return rec.nome || "";
    if (coll === "nfEmitidas" || coll === "nfEntrada") return "nº " + (rec.numero || "");
    return "";
  }
  function logAction(acao, detalhe) {
    if (window.SB && Store._cloud) { try { window.SB.log(acao, detalhe, Store._userEmail); } catch (e) {} }
  }

  // ---- backup automático (1x por hora) ----
  var UMA_HORA = 60 * 60 * 1000;
  function talvezBackup() {
    if (!Store._cloud || !window.SB) return;
    var agora = new Date().getTime();
    if (Store._lastBackup && (agora - Store._lastBackup) < UMA_HORA) return;
    Store._lastBackup = agora;
    try { window.SB.saveBackup(Store.state, Store._userEmail).catch(function () { }); } catch (e) { }
  }

  var Store = {
    state: null,
    _saveTimer: null,

    backend: function () { return Store._cloud ? "nuvem" : BACKEND; },
    isCloud: function () { return !!Store._cloud; },

    init: function () {
      // modo nuvem (Supabase) tem prioridade quando configurado
      if (window.SB && window.SB.configured && window.SB.ready()) {
        Store._cloud = true;
        return window.SB.loadState().then(function (data) {
          if (data && Array.isArray(data.processos) && data.processos.length) {
            Store.state = ensureIds(data); Store._fromSeed = false;
            return Store.state;
          }
          // primeira vez na nuvem: migra os dados atuais (seed)
          Store.state = ensureIds(deepClone(window.SEED_DATA || { processos: [], itens: [], boletos: [], cambio: [], clientes: [] }));
          Store._fromSeed = true;
          return Store.persistNow().then(function () { return Store.state; });
        });
      }
      // modo local (IndexedDB / localStorage)
      return backendGet(KEY).then(function (saved) {
        if (saved && saved.processos) {
          Store.state = ensureIds(saved);
          Store._fromSeed = false;
        } else {
          Store.state = ensureIds(deepClone(window.SEED_DATA || { processos: [], itens: [], boletos: [], cambio: [], clientes: [] }));
          Store._fromSeed = true;
          return Store.persistNow().then(function () { return Store.state; });
        }
        return Store.state;
      });
    },

    // grava (debounced)
    save: function () {
      if (Store._saveTimer) clearTimeout(Store._saveTimer);
      Store._saveTimer = setTimeout(function () { Store.persistNow(); talvezBackup(); }, 250);
    },

    setUser: function (email) { Store._userEmail = email || null; },
    user: function () { return Store._userEmail || null; },
    // dispara o backup automático de tempos em tempos e ao entrar
    startBackupTimer: function () {
      talvezBackup();
      if (Store._bkTimer) return;
      Store._bkTimer = setInterval(talvezBackup, 10 * 60 * 1000); // checa a cada 10 min; grava se passou 1h
    },
    log: logAction,

    persistNow: function () {
      if (Store._cloud && window.SB) {
        return window.SB.saveState(Store.state).then(function () {
          document.dispatchEvent(new CustomEvent("store:saved"));
          return true;
        }).catch(function (e) {
          document.dispatchEvent(new CustomEvent("store:save-error", { detail: e }));
          throw e;
        });
      }
      return backendSet(KEY, Store.state).then(function () {
        document.dispatchEvent(new CustomEvent("store:saved"));
        return true;
      });
    },

    newId: newId,

    // ---- helpers de coleção ----
    find: function (coll, id) {
      return (Store.state[coll] || []).filter(function (r) { return r._id === id; })[0] || null;
    },
    add: function (coll, rec) {
      if (!rec._id) rec._id = newId(coll.substring(0, 3));
      Store.state[coll].push(rec);
      Store.save();
      logAction("Incluiu " + (COLL_LABEL[coll] || coll), descRec(coll, rec));
      return rec;
    },
    remove: function (coll, id) {
      var arr = Store.state[coll];
      var i = arr.findIndex(function (r) { return r._id === id; });
      if (i >= 0) { var rec = arr[i]; arr.splice(i, 1); Store.save(); logAction("Excluiu " + (COLL_LABEL[coll] || coll), descRec(coll, rec)); return true; }
      return false;
    },
    update: function (coll, id, patch) {
      var rec = Store.find(coll, id);
      if (rec) { Object.assign(rec, patch); Store.save(); logAction("Editou " + (COLL_LABEL[coll] || coll), descRec(coll, rec)); }
      return rec;
    },

    exportJSON: function () {
      return JSON.stringify(Store.state, null, 2);
    },
    importJSON: function (obj) {
      if (typeof obj === "string") obj = JSON.parse(obj);
      if (!obj || !Array.isArray(obj.processos)) throw new Error("Arquivo inválido: não parece um backup do sistema.");
      Store.state = ensureIds(obj);
      return Store.persistNow();
    },
    resetToSeed: function () {
      Store.state = ensureIds(deepClone(window.SEED_DATA));
      return Store.persistNow();
    },

    // garante _id em todos os registros (após importação que substitui coleções)
    reindex: function () { ensureIds(Store.state); },

    // snapshot de segurança antes de sincronizar (permite desfazer)
    savePresync: function () {
      return backendSet("presync", { state: deepClone(Store.state), at: new Date().toISOString() });
    },
    getPresync: function () { return backendGet("presync"); },
    undoSync: function () {
      return backendGet("presync").then(function (snap) {
        if (snap && snap.state) {
          Store.state = ensureIds(snap.state);
          return Store.persistNow().then(function () { return true; });
        }
        return false;
      });
    }
  };

  window.Store = Store;
})();

</script>
<script>
/* calc.js — cálculos financeiros e indicadores */
(function () {
  "use strict";

  function n(v) { return (typeof v === "number" && isFinite(v)) ? v : 0; }
  function sum(arr, f) { return arr.reduce(function (a, x) { return a + n(f(x)); }, 0); }

  var TIPO_NORM = {
    "saldo nfe": "Saldo NFe", "saldo nf-e": "Saldo NFe", "saldo de nf-e": "Saldo NFe",
    "câmbio": "Câmbio", "cambio": "Câmbio", "registro": "Registro"
  };
  function normTipo(t) {
    if (!t) return "";
    var k = String(t).toLowerCase().trim();
    return TIPO_NORM[k] || t;
  }

  // linha da aba RESUMO para um processo (fonte oficial de faturamento e saldo de NF-e)
  function resumoRow(s, pid) {
    var arr = (s && s.resumo) || [];
    for (var i = 0; i < arr.length; i++) { if (arr[i].processoId === pid) return arr[i]; }
    return null;
  }

  var Calc = {
    n: n, sum: sum, normTipo: normTipo, resumoRow: resumoRow,

    itensDoProc: function (s, pid) { return s.itens.filter(function (i) { return i.processoId === pid; }); },
    boletosDoProc: function (s, pid) { return s.boletos.filter(function (b) { return b.processoId === pid; }); },
    cambioDoProc: function (s, pid) { return s.cambio.filter(function (c) { return c.processoId === pid; }); },

    pago: function (b) {
      var p = (b.pago || "").toString().toLowerCase().trim();
      return p === "sim" || p === "pago" || p === "true";
    },

    valorRecebidoBoleto: function (b) {
      if (Calc.pago(b)) return n(b.valorRecebido) || n(b.valor);
      return n(b.valorRecebido);
    },

    // status operacional de um boleto
    statusBoleto: function (b) {
      if (Calc.pago(b)) return "pago";
      var dias = window.Fmt.diasAte(b.vencimento);
      if (dias === null) return "aberto";
      if (dias < 0) return "vencido";
      if (dias <= 7) return "vence-breve";
      return "aberto";
    },

    // faturamento vem da aba RESUMO (fonte oficial); se faltar, soma os itens
    faturamento: function (s, pid) {
      var r = resumoRow(s, pid);
      if (r && r.faturamento != null) return n(r.faturamento);
      return sum(Calc.itensDoProc(s, pid), function (i) { return i.valorTotal; });
    },
    valorProduto: function (s, pid) { return sum(Calc.itensDoProc(s, pid), function (i) { return i.valorProduto; }); },
    // saldo de NF-e (MRD) vem da aba RESUMO; se faltar, calcula por NF MRD − adiantamento − CIF
    saldoNFeProc: function (s, pid) {
      var r = resumoRow(s, pid);
      if (r && r.saldoNFe != null) return n(r.saldoNFe);
      var p = (s.processos || []).filter(function (x) { return x.id === pid; })[0] || {};
      var c = p.custo || {};
      return n(c.nfMRD) - n(c.adiantamento) - n(c.valorCIF);
    },

    // NF de saída (emitidas AKOS) de um processo
    nfSaidaDoProc: function (s, pid) { return (s.nfEmitidas || []).filter(function (x) { return x.processoId === pid; }); },
    // "PAGO MRD" preenchido = saldo de NF-e já pago à MRD
    pagoMRD: function (it) { return !!(("" + (it.pagoMRDStatus || "")).trim()); },
    saldoNFePagoProc: function (s, pid) { return sum(Calc.itensDoProc(s, pid).filter(function (i) { return Calc.pagoMRD(i); }), function (i) { return i.saldoNFeE; }); },
    saldoNFeAPagarProc: function (s, pid) { return sum(Calc.itensDoProc(s, pid).filter(function (i) { return !Calc.pagoMRD(i); }), function (i) { return i.saldoNFeE; }); },

    recebido: function (s, pid) {
      return sum(Calc.boletosDoProc(s, pid).filter(Calc.pago), function (b) { return Calc.valorRecebidoBoleto(b); });
    },
    aReceber: function (s, pid) {
      // considera também pagamentos parciais (boleto pago com valor recebido < valor)
      return sum(Calc.boletosDoProc(s, pid), function (b) {
        return Calc.pago(b) ? Math.max(0, n(b.valor) - Calc.valorRecebidoBoleto(b)) : n(b.valor);
      });
    },

    // resumo consolidado de um processo
    resumoProc: function (s, p) {
      var pid = p.id;
      var fat = Calc.faturamento(s, pid);
      var rec = Calc.recebido(s, pid);
      var aRec = Calc.aReceber(s, pid);
      var bol = Calc.boletosDoProc(s, pid);
      var porTipo = function (t) { return bol.filter(function (b) { return normTipo(b.tipo) === t; }); };
      var cust = p.custo || {};
      var rr = resumoRow(s, pid);
      return {
        processo: p,
        faturamento: fat,
        valorProduto: Calc.valorProduto(s, pid),
        adiantamento: (rr && rr.adiantamento != null) ? n(rr.adiantamento) : (n(p.valorAKOSxMRD) || n(cust.adiantamento)),
        recebido: rec,
        aReceber: aRec,
        cif: n(cust.valorCIF),
        saldoNFe: Calc.saldoNFeProc(s, pid),
        saldoFavorMRD: n(cust.saldoFavorMRD),
        taxaAdm: n(p.txAdmMRD) || n(cust.taxaAdmMRD),
        nBoletos: bol.length,
        boletoA: sum(porTipo("Saldo NFe"), function (b) { return b.valor; }),
        boletoB: sum(porTipo("Câmbio"), function (b) { return b.valor; }),
        boletoC: sum(porTipo("Registro"), function (b) { return b.valor; }),
        boletosPagos: bol.filter(Calc.pago).length,
        boletosVencidos: bol.filter(function (b) { return Calc.statusBoleto(b) === "vencido"; }).length
      };
    },

    // KPIs do dashboard
    isFaturado: function (s, pid) { return Calc.faturamento(s, pid) > 0; },

    dashboard: function (s) {
      var totFat = 0, totAdiant = 0;
      s.processos.forEach(function (p) {
        var r = Calc.resumoProc(s, p);
        totFat += r.faturamento; totAdiant += r.adiantamento;
      });
      // processos faturados x pendentes de faturamento
      var faturados = s.processos.filter(function (p) { return Calc.faturamento(s, p.id) > 0; });
      var faturadoIds = {}; faturados.forEach(function (p) { faturadoIds[p.id] = true; });
      var naoFaturados = s.processos.filter(function (p) { return !(Calc.faturamento(s, p.id) > 0); });
      // processos "verdes" (recebemos o Boleto A) — base para taxa adm e saldo de NF-e pendentes
      var greenIds = {}; s.processos.forEach(function (p) { if (p.txAdmVerde) greenIds[p.id] = true; });
      // recebido e a receber calculados sobre TODOS os boletos (inclui parciais e órfãos) para reconciliar com a contagem
      var totRec = sum(s.boletos.filter(Calc.pago), function (b) { return Calc.valorRecebidoBoleto(b); });
      var totAReceber = sum(s.boletos, function (b) { return Calc.pago(b) ? Math.max(0, n(b.valor) - Calc.valorRecebidoBoleto(b)) : n(b.valor); });
      var totBoletos = totRec + totAReceber;
      var venc = s.boletos.filter(function (b) { return Calc.statusBoleto(b) === "vencido"; });
      var breve = s.boletos.filter(function (b) { return Calc.statusBoleto(b) === "vence-breve"; });
      var abertos = s.boletos.filter(function (b) { return !Calc.pago(b); });
      var cambioPend = s.cambio.filter(function (c) {
        var p = (c.pagos || "").toLowerCase();
        return p !== "sim" && !n(c.cambioRealizado);
      });
      return {
        nProcessos: s.processos.length,
        nClientes: (s.clientes || []).length,
        faturamento: totFat,
        saldoNFe: sum(s.processos, function (p) { return Calc.saldoNFeProc(s, p.id); }),
        recebido: totRec,
        aReceber: totAReceber,
        adiantamento: totAdiant,
        pctRecebido: totBoletos ? totRec / totBoletos : 0,
        // KPIs do painel "clean"
        nFaturados: faturados.length,
        boletoASaldoAReceber: sum(s.boletos.filter(function (b) { return normTipo(b.tipo) === "Saldo NFe" && !Calc.pago(b); }), function (b) { return b.valor; }),
        processosAFaturar: naoFaturados.length,
        processosAFaturarLista: naoFaturados.map(function (p) { return p.id; }),
        comissaoMRD: sum(s.itens, function (i) { return i.comissaoDeb; }),
        // taxa adm pendente = célula TX ADM MRD verde (Boleto A recebido) E PAGO em branco
        taxaAdmPendente: sum(s.processos.filter(function (p) {
          return p.txAdmVerde && !(("" + (p.txAdmPago || "")).trim());
        }), function (p) { return p.txAdmMRD; }),
        taxaAdmPendenteLista: s.processos.filter(function (p) {
          return p.txAdmVerde && !(("" + (p.txAdmPago || "")).trim());
        }).map(function (p) { return p.id; }),
        // saldo de NF-e a pagar = processo verde + PAGO MRD em branco + valor positivo
        saldoNFeAPagar: sum(s.itens.filter(function (i) {
          return greenIds[i.processoId] && !Calc.pagoMRD(i) && n(i.saldoNFeE) > 0;
        }), function (i) { return i.saldoNFeE; }),
        saldoNFeAPagarLista: (function () {
          var set = {};
          s.itens.forEach(function (i) { if (greenIds[i.processoId] && !Calc.pagoMRD(i) && n(i.saldoNFeE) > 0) set[i.processoId] = true; });
          return Object.keys(set).sort();
        })(),
        // comissão Sanvix = R$ 1.000 por processo faturado
        comissaoSanvix: faturados.length * 1000,
        nBoletos: s.boletos.length,
        boletosAbertos: abertos.length,
        valorAbertos: sum(abertos, function (b) { return b.valor; }),
        boletosVencidos: venc.length,
        valorVencidos: sum(venc, function (b) { return b.valor; }),
        boletosVenceBreve: breve.length,
        valorVenceBreve: sum(breve, function (b) { return b.valor; }),
        cambioPendente: cambioPend.length,
        valorCambioPendente: sum(cambioPend, function (c) { return c.boletoB; })
      };
    },

    // DRE consolidada (calculada a partir dos custos por processo)
    dre: function (s) {
      var procs = s.processos;
      var cu = function (f) { return sum(procs, function (p) { return (p.custo || {})[f]; }); };
      var vendasBrutas = sum(procs, function (p) { return Calc.faturamento(s, p.id); });
      var icms = cu("icmsSaida"), ipi = cu("ipiSaida"), pis = cu("pisSaida"), cofins = cu("cofinsSaida");
      var taxaAdm = sum(procs, function (p) { return n(p.txAdmMRD) || n((p.custo || {}).taxaAdmMRD); });
      var deducoes = icms + ipi + pis + cofins + taxaAdm;
      var vendasLiquidas = vendasBrutas - deducoes;

      // Compras = NF de entrada (importação) = base de cálculo + ICMS + IPI (composição,
      // mais fiel que o valor digitado da NF, que pode ter arredondamento na planilha).
      var compras = sum(procs, function (p) {
        var c = p.custo || {};
        return n(c.baseEntrada) + n(c.icmsEntradaCred) + n(c.ipiEntradaCred);
      });
      var credIcms = cu("icmsEntradaCred"), credIpi = cu("ipiEntradaCred");
      var credPis = cu("pisDI"), credCofins = cu("cofinsDI");
      var creditos = credIcms + credIpi + credPis + credCofins;
      var cmv = compras - creditos;
      var lucroBruto = vendasLiquidas - cmv;

      return {
        vendasBrutas: vendasBrutas,
        icms: icms, ipi: ipi, pis: pis, cofins: cofins, taxaAdm: taxaAdm,
        deducoes: deducoes,
        vendasLiquidas: vendasLiquidas,
        compras: compras,
        credIcms: credIcms, credIpi: credIpi, credPis: credPis, credCofins: credCofins, creditos: creditos,
        cmv: cmv,
        lucroBruto: lucroBruto,
        margemBruta: vendasBrutas ? lucroBruto / vendasBrutas : 0,
        // referência: composição do custo de importação
        cif: cu("valorCIF"), impNac: cu("impostosNacionalizacao"),
        despachante: cu("despachanteSubtotal"), totalCusto: cu("totalCusto"),
        // visão "ganho MRD"
        saldoNFe: cu("saldoNFe"),
        saldoFavorMRD: cu("saldoFavorMRD"),
        adiantamento: sum(procs, function (p) { return n(p.valorAKOSxMRD) || n((p.custo || {}).adiantamento); })
      };
    },

    // fluxo de caixa: entradas (recebimentos) x saídas (custos de importação)
    fluxo: function (s) {
      var entradas = sum(s.boletos.filter(Calc.pago), function (b) { return Calc.valorRecebidoBoleto(b); });
      var adiant = sum(s.processos, function (p) { return n(p.valorAKOSxMRD) || n((p.custo || {}).adiantamento); });
      var saidasCIF = sum(s.processos, function (p) { return n((p.custo || {}).valorCIF); });
      var saidasNac = sum(s.processos, function (p) { return n((p.custo || {}).impostosNacionalizacao); });
      var saidasDesp = sum(s.processos, function (p) { return n((p.custo || {}).despachanteSubtotal); });
      var saidas = saidasCIF + saidasNac + saidasDesp;

    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class" || k === "className") node.className = v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "text") node.textContent = v;
        else if (k === "dataset") { Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; }); }
        else if (k.indexOf("on") === 0 && typeof v === "function") node.addEventListener(k.substring(2).toLowerCase(), v);
        else if (k === "style" && typeof v === "object") { Object.assign(node.style, v); }

          var td = el("td", { class: [c.align ? "t-" + c.align : "", c.cls ? (typeof c.cls === "function" ? c.cls(row) : c.cls) : ""].join(" ").trim() || null });

    var box = el("div", { class: "modal" + (opts.wide ? " modal-wide" : "") }, [

  function confirmar(msg, onYes, opts) {
    opts = opts || {};
    modal(opts.title || "Confirmar", el("p", null, msg), {
      buttons: [
        { label: "Cancelar", kind: "ghost" },

      ]

  function toast(msg, kind) {

    var host = document.getElementById("toasts") || (function () {

    setTimeout(function () { t.classList.remove("show"); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 300); }, 2600);

  // ---- formulário genérico ----
  // fields = [{key,label,type,options?,value?,step?,required?,help?}]
  function form(fields, values) {
    values = values || {};
    var inputs = {};
    var grid = el("div", { class: "form-grid" });
    fields.forEach(function (f) {
      var val = values[f.key] != null ? values[f.key] : (f.value != null ? f.value : "");

        }));
      } else if (f.type === "textarea") {
        input = el("textarea", { class: "inp", rows: f.rows || 3 }, String(val));
      } else if (f.type === "money") {

        input.dataset.money = "1";
      } else if (f.type === "date") {

      } else {
        input = el("input", { class: "inp", type: f.type || "text", value: String(val) });
      }
      inputs[f.key] = input;
      grid.appendChild(el("label", { class: "field" + (f.wide ? " field-wide" : "") }, [
        el("span", { class: "field-label" }, f.label + (f.required ? " *" : "")),
        input,
        f.help ? el("span", { class: "field-help" }, f.help) : null
      ]));
    });
    function read() {
      var out = {};
      fields.forEach(function (f) {
        var raw = inputs[f.key].value;
        if (f.type === "money") out[f.key] = window.Fmt.parseNum(raw);
        else if (f.type === "number") out[f.key] = raw === "" ? null : Number(raw);
        else out[f.key] = raw === "" ? null : raw;
      });
      return out;
    }
    return { node: grid, read: read, inputs: inputs };
  }

  // varre o DOM e pinta de vermelho qualquer número negativo (R$, %, etc.)
  var NEG_RE = /(?<![\w\d])-(?:R\$\s?)?\d[\d. ]*(?:,\d+)?%?/g;
  function colorNegatives(root) {
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue || n.nodeValue.indexOf("-") < 0) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode;
        if (!p) return NodeFilter.FILTER_REJECT;
        var tag = p.nodeName;
        if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "OPTION") return NodeFilter.FILTER_REJECT;
        if (p.classList && p.classList.contains("neg")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      var text = n.nodeValue; NEG_RE.lastIndex = 0;
      if (!NEG_RE.test(text)) return;
      NEG_RE.lastIndex = 0;
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = NEG_RE.exec(text))) {
        if (m[0].length === 0) { NEG_RE.lastIndex++; continue; }
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var span = document.createElement("span");
        span.className = "neg";
        span.textContent = m[0];
        frag.appendChild(span);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      if (last > 0) n.parentNode.replaceChild(frag, n);
    });
  }

  function download(filename, content, mime) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: filename });

  }

  window.UI = {
    el: el, clear: clear, table: table, badge: badge, statusBadge: statusBadge,
    kpi: kpi, section: section, modal: modal, confirmar: confirmar, toast: toast,
    form: form, download: download, appendChildren: appendChildren, colorNegatives: colorNegatives
  };
})();

<script>
/* nfpdf.js — lê o PDF do DANFE e extrai os dados da NF-e (valores, impostos, NCM, chave) */
(function () {
  "use strict";

  var PDFJS_SRC = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
  var PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  var _libPromise = null;

  function loadLib() {
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return Promise.resolve(window.pdfjsLib);
    }
    if (_libPromise) return _libPromise;
    _libPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = PDFJS_SRC;
      s.onload = function () {
        if (!window.pdfjsLib) { reject(new Error("Não consegui carregar o leitor de PDF.")); return; }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        resolve(window.pdfjsLib);
      };
      s.onerror = function () { reject(new Error("Sem conexão para carregar o leitor de PDF.")); };
      document.head.appendChild(s);
    });
    return _libPromise;
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(new Uint8Array(r.result)); };
      r.onerror = function () { reject(new Error("Não consegui ler o arquivo.")); };
      r.readAsArrayBuffer(file);
    });
  }

  // extrai todo o texto do PDF
  function extractText(file) {
    return loadLib().then(function (pdfjsLib) {
      return readFile(file).then(function (bytes) {
        return pdfjsLib.getDocument({ data: bytes }).promise;
      }).then(function (pdf) {
        var pages = [];
        for (var i = 1; i <= pdf.numPages; i++) pages.push(i);
        return pages.reduce(function (chain, n) {
          return chain.then(function (acc) {
            return pdf.getPage(n).then(function (page) { return page.getTextContent(); })
              .then(function (tc) {
                var txt = tc.items.map(function (it) { return it.str; }).join(" ");
                return acc + " " + txt;
              });
          });
        }, Promise.resolve(""));
      });
    });
  }

  // ---- utilidades de parsing ----
  function norm(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ");
  }
  function toNum(s) {
    if (!s) return null;
    var v = String(s).replace(/\./g, "").replace(",", ".");
    var n = parseFloat(v);
    return isFinite(n) ? n : null;
  }
  var MONEY = "(\\d{1,3}(?:\\.\\d{3})*,\\d{2})";
  // procura o primeiro valor monetário depois de um rótulo
  function moneyAfter(T, label) {
    var i = T.indexOf(label);
    if (i < 0) return null;
    var slice = T.substring(i + label.length, i + label.length + 120);
    var m = slice.match(new RegExp(MONEY));
    return m ? toNum(m[1]) : null;
  }
  function firstOf(T, labels) {
    for (var i = 0; i < labels.length; i++) {
      var v = moneyAfter(T, labels[i]);
      if (v != null) return v;
    }
    return null;
  }

  function parse(rawText) {
    var T = norm(rawText);
    var out = { rawText: rawText };

    // chave de acesso (44 dígitos, normalmente impressa em grupos de 4)
    var chave = null;
    var mk = T.match(/((?:\d[ ]?){44})/);
    if (mk) {
      var only = mk[1].replace(/\D/g, "");
      if (only.length === 44) chave = only;
    }
    out.chave = chave;

    // pela chave dá para tirar número e série com precisão
    if (chave) {
      out.serie = String(parseInt(chave.substr(22, 3), 10));
      out.numero = String(parseInt(chave.substr(25, 9), 10));
    }
    // número também pode vir rotulado
    if (!out.numero) {
      var mn = T.match(/N[º°O]?\.?\s*([\d.]{3,15})\s*(?:SERIE|S[EÉ]RIE)/);
      if (mn) out.numero = mn[1].replace(/\D/g, "").replace(/^0+/, "");
    }

    // data de emissão
    var md = T.match(/DATA D[AE] EMISS[AÃ]O[^0-9]{0,40}(\d{2}\/\d{2}\/\d{4})/);
    if (!md) md = T.match(/(\d{2}\/\d{2}\/\d{4})/);
    if (md) {
      var p = md[1].split("/");
      out.emissao = p[2] + "-" + p[1] + "-" + p[0];
    }

    // valores
    out.valorProduto = firstOf(T, ["VALOR TOTAL DOS PRODUTOS", "V. TOTAL PRODUTOS", "VLR TOTAL PRODUTOS"]);
    out.valorNF = firstOf(T, ["VALOR TOTAL DA NOTA", "V. TOTAL DA NOTA", "VALOR TOTAL DA NF"]);
    out.icms = firstOf(T, ["VALOR DO ICMS", "VLR DO ICMS", "VALOR ICMS"]);
    out.ipi = firstOf(T, ["VALOR TOTAL DO IPI", "VALOR TOTAL IPI", "VALOR DO IPI", "VLR TOTAL IPI", "VLR TOTAL DO IPI"]);
    out.pis = firstOf(T, ["VALOR DO PIS", "VALOR PIS", "V. PIS"]);
    out.cofins = firstOf(T, ["VALOR DA COFINS", "VALOR DO COFINS", "VALOR COFINS", "V. COFINS"]);
    out.baseIcms = firstOf(T, ["BASE DE CALCULO DO ICMS", "BASE DE CALCULO ICMS"]);
    out.frete = firstOf(T, ["VALOR DO FRETE", "VALOR TOTAL DO FRETE"]);

    // NCM: procura na área dos itens (depois do cabeçalho NCM/SH)
    var ncms = [];
    var iN = T.indexOf("NCM");
    if (iN >= 0) {
      var itens = T.substring(iN, iN + 6000);
      var re = /\b(\d{8})\b/g, m;
      while ((m = re.exec(itens)) !== null) {
        if (ncms.indexOf(m[1]) < 0) ncms.push(m[1]);
        if (ncms.length >= 12) break;
      }
    }
    out.ncms = ncms;
    out.ncm = ncms.length ? ncms.map(function (c) { return c.substr(0, 4) + "." + c.substr(4, 2) + "." + c.substr(6, 2); }).join(", ") : null;

    // nome do destinatário (melhor esforço)
    var mdest = T.match(/DESTINAT[AÁ]RIO[^A-Z]{0,20}REMETENTE\s+NOME\s*\/?\s*RAZ[AÃ]O SOCIAL\s+([A-Z0-9 .,&\-\/]{5,60}?)\s+(?:CNPJ|CPF|\d{2}\.\d{3}\.\d{3})/);
    if (mdest) out.destinatario = mdest[1].trim();

    return out;
  }

  window.NFPDF = {
    fromFile: function (file) { return extractText(file).then(parse); },
    parse: parse
  };
})();

</script>

  function editarCusto(p) {

    function n(v) { return (typeof v === "number" && isFinite(v)) ? v : 0; }

    function field(label, key) { return el("label", { class: "field" }, [el("span", { class: "field-label" }, label), money(key, c[key])]); }
    function rd(key) { return Fmt.parseNum(inp[key] ? inp[key].value : null); }

    (c.despesasDespachante || []).forEach(addDesp);

    function despTotal() { var t = 0; Array.prototype.forEach.call(despWrap.querySelectorAll(".desp-row"), function (r) { t += n(Fmt.parseNum(r._v.value)); }); return t; }

    function recompute() {

      var impNac = n(rd("ii")) + n(rd("ipiNac")) + n(rd("pisNac")) + n(rd("cofinsNac")) + n(rd("icmsNac"));
      var despSub = despTotal();

      set("saldoNFe", saldoNFe); set("saldoFavorMRD", saldoFav);
      recompute._vals = { cif: cif, impNac: impNac, despSub: despSub, totalCusto: totalCusto, credAdq: credAdq, totalSaida: totalSaida, saldoNFe: saldoNFe, saldoFav: saldoFav };

        calcRow("= Valor CIF", "valorCIF")

      sec("NF de entrada (importação)", el("div", null, [
        grid([field("Base de cálculo", "baseEntrada"), field("(–) Crédito de imposto IPI", "creditoIpi"), field("Valor da NF de entrada", "nfEntradaValor")])
      ])),
      sec("Créditos de imposto (adquirente)", el("div", null, [
        grid([field("PIS – DI", "pisDI"), field("COFINS – DI", "cofinsDI"), field("ICMS – NF de entrada", "icmsEntradaCred"), field("IPI – NF de entrada", "ipiEntradaCred")]),

    recompute();

    UI.modal("Custos do processo " + p.id, body, {
      wide: true,
      buttons: [
        { label: "Cancelar", kind: "ghost" },
        { label: "Salvar custos", kind: "primary", onClick: function () {
            recompute();
            var v = recompute._vals;
            var despesas = [];
            Array.prototype.forEach.call(despWrap.querySelectorAll(".desp-row"), function (r) {
              var d = (r._d.value || "").trim(); var val = Fmt.parseNum(r._v.value);
              if (d || val != null) despesas.push({ descricao: d, valor: val });
            });
            var novo = {
              bl: c.bl || p.blAwb || null,
              fob: rd("fob"), freteInternacional: rd("freteInternacional"), seguroInternacional: rd("seguroInternacional"), capatazias: rd("capatazias"), valorCIF: v.cif,
              ii: rd("ii"), ipiNac: rd("ipiNac"), pisNac: rd("pisNac"), cofinsNac: rd("cofinsNac"), icmsNac: rd("icmsNac"), impostosNacionalizacao: v.impNac,
              despesasDespachante: despesas, despachanteSubtotal: v.despSub, totalCusto: v.totalCusto,
              baseEntrada: rd("baseEntrada"), creditoIpi: rd("creditoIpi"), nfEntradaValor: rd("nfEntradaValor"),
              pisDI: rd("pisDI"), cofinsDI: rd("cofinsDI"), icmsEntradaCred: rd("icmsEntradaCred"), ipiEntradaCred: rd("ipiEntradaCred"), creditoAdquirente: v.credAdq,
              taxaAdmMRD: rd("taxaAdmMRD"), baseSaida: rd("baseSaida"), pisSaida: rd("pisSaida"), cofinsSaida: rd("cofinsSaida"), icmsSaida: rd("icmsSaida"), difal: rd("difal"), margemIRCSLL: rd("margemIRCSLL"), ipiSaida: rd("ipiSaida"), totalNFsaida: v.totalSaida,
              nfMRD: rd("nfMRD"), adiantamento: rd("adiantamento"), cifMercFrete: v.cif, saldoNFe: v.saldoNFe, prestacaoServMRD: rd("prestacaoServMRD"), saldoFavorMRD: v.saldoFav,
              rawRows: null
            };
            Store.update("processos", p._id, { custo: novo });
            UI.toast("Custos salvos."); rerender();

    });

        var itemCols = GERAL_COLS.filter(function (c) { return c.lvl === "it"; });
        body.appendChild(el("div", { class: "vert-block" }, [
          el("h4", { class: "vert-title" }, "Dados do processo"),
          kvVert(procCols, p),
          el("div", { class: "vert-actions" }, [el("a", { class: "link-mini", href: "#/processos/" + encodeURIComponent(p.id) }, "abrir processo completo →")])
        ]));
        its.forEach(function (it) {
          body.appendChild(el("div", { class: "vert-block" }, [
            el("h4", { class: "vert-title" }, "NF-e " + (it.nfe || "?") + (it.cliente ? " · " + it.cliente : "")),
            kvVert(itemCols, it)
          ]));
        });
        if (!its.length) body.appendChild(el("div", { class: "empty" }, "Este processo ainda não tem NF-e cadastrada."));
        return;
      }

      // ---- vista TABELA (todos) ----
      var rows = [];
      s().processos.forEach(function (p) {
        var its = Calc.itensDoProc(s(), p.id);
        if (st.busca) {
          its = its.filter(function (it) {
            var hay = ((it && it.cliente) || "") + " " + ((it && it.nfe) || "");
            return hay.toLowerCase().indexOf(st.busca) >= 0;
          });
          if (!its.length) return;
        }
        if (!its.length) its = [null];
        its.forEach(function (it, idx) { rows.push({ p: p, it: it, first: idx === 0 }); });
      });

      function total(c) {
        if (c.lvl === "it") return rows.reduce(function (a, r) { return a + (r.it ? Calc.n(r.it[c.f]) : 0); }, 0);
        return rows.filter(function (r) { return r.first; }).reduce(function (a, r) { return a + Calc.n(r.p[c.f]); }, 0);
      }
      var foot = el("tr", { class: "foot" }, GERAL_COLS.map(function (c, i) {
        if (i === 0) return el("td", null, "TOTAL");
        if (c.tot) { var tv = total(c); return el("td", { class: "t-right" + (tv < 0 ? " neg" : "") }, brl(tv)); }
        return el("td", null, "");
      }));

      var nProc = rows.filter(function (r) { return r.first; }).length;
      head.textContent = rows.length + " linha(s) · " + nProc + " processo(s) — selecione um processo acima para ver os detalhes organizados";
      body.appendChild(el("div", { class: "scroll-x" }, UI.table(cols, rows, {
        dense: true, footer: foot, emptyMsg: "Nenhuma linha para o filtro selecionado.",
        onRowClick: function (row) { go("#/processos/" + encodeURIComponent(row.p.id)); }
      })));
    }
    render();
    return wrap;
  };

      r = r || { label: "", value: null, value2: null };

      var vi = el("input", { class: "inp t-right", type: "text", inputmode: "decimal", placeholder: "valor", value: (r.value != null ? Fmt.money(r.value) : "") });
      var v2 = el("input", { class: "inp t-right", type: "text", inputmode: "decimal", placeholder: "% (opc.)", value: (r.value2 != null ? Fmt.num(r.value2 * (r.value2 < 1 ? 100 : 1), 2) : "") });

  function importarNfPDF() {
    var inp = el("input", { type: "file", accept: "application/pdf,.pdf", style: { display: "none" } });
    inp.addEventListener("change", function () {
      var file = inp.files && inp.files[0];
      if (!file) return;
      UI.toast("Lendo o PDF…");
      window.NFPDF.fromFile(file).then(function (d) {
        revisarNfImportada(d, file.name);
      }).catch(function (e) {
        UI.toast("Não consegui ler o PDF: " + (e && e.message ? e.message : e), "danger");
      });
    });
    document.body.appendChild(inp); inp.click();
    setTimeout(function () { inp.remove(); }, 1000);
  }

  // mostra o que foi extraído para o usuário conferir/corrigir antes de salvar
  function revisarNfImportada(d, fileName) {
    var achou = [];
    if (d.numero) achou.push("nº " + d.numero);
    if (d.valorNF != null) achou.push("valor da NF");
    if (d.valorProduto != null) achou.push("produtos");
    if (d.ncms && d.ncms.length) achou.push(d.ncms.length + " NCM");

    var tipoSel = el("select", { class: "inp" }, [
      el("option", { value: "saida" }, "NF de Saída (emitida pela AKOS)"),
      el("option", { value: "entrada" }, "NF de Entrada (emitida pela MRD)")
    ]);
    var procSel = el("select", { class: "inp" }, [el("option", { value: "" }, "— selecione —")].concat(
      procOpts().map(function (id) { return el("option", { value: id }, id); })
    ));

    var f = UI.form([
      { key: "numero", label: "Nº da NF", type: "text" },
      { key: "emissao", label: "Emissão", type: "date" },
      { key: "parceiro", label: "Destinatário / Cliente", type: "text", wide: true },
      { key: "valorProduto", label: "Valor dos produtos", type: "money" },
      { key: "valorNF", label: "Valor total da NF", type: "money" },
      { key: "ipi", label: "IPI", type: "money" },
      { key: "icms", label: "ICMS", type: "money" },
      { key: "pis", label: "PIS", type: "money" },
      { key: "cofins", label: "COFINS", type: "money" },
      { key: "ncm", label: "NCM(s)", type: "text", wide: true },
      { key: "chave", label: "Chave de acesso", type: "text", wide: true }
    ], {
      numero: d.numero, emissao: d.emissao, parceiro: d.destinatario,
      valorProduto: d.valorProduto, valorNF: d.valorNF, ipi: d.ipi, icms: d.icms,
      pis: d.pis, cofins: d.cofins, ncm: d.ncm, chave: d.chave
    });

    var body = el("div", null, [
      el("div", { class: "imp-info" }, [
        el("strong", null, "Arquivo: "), fileName || "PDF",
        el("br"), (achou.length ? ("Encontrei automaticamente: " + achou.join(", ") + ".") : "Não consegui identificar os campos automaticamente."),
        el("br"), el("span", { class: "muted" }, "Confira e corrija o que precisar antes de salvar.")
      ]),
      el("div", { class: "form-grid" }, [
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Tipo da nota"), tipoSel]),
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Processo"), procSel])
      ]),
      f.node,
      el("details", { class: "raw-details" }, [
        el("summary", null, "Ver texto lido do PDF (para conferência)"),
        el("pre", { class: "raw-pdf" }, (d.rawText || "").substring(0, 4000))
      ])
    ]);

    UI.modal("Importar NF do PDF", body, {
      wide: true,
      buttons: [
        { label: "Cancelar", kind: "ghost" },
        { label: "Salvar nota", kind: "primary", onClick: function () {
            var v = f.read();
            var rec = {
              processoId: procSel.value || null,
              numero: v.numero, emissao: v.emissao,
              valorProduto: v.valorProduto, ipi: v.ipi, icms: v.icms, pis: v.pis,
              ncm: v.ncm, chave: v.chave
            };
            if (tipoSel.value === "saida") {
              rec.destinatario = v.parceiro; rec.valorNF = v.valorNF; rec.cofins = v.cofins;
              Store.add("nfEmitidas", rec);
            } else {
              rec.cliente = v.parceiro; rec.valorTotal = v.valorNF;
              Store.add("nfEntrada", rec);
            }
            UI.toast("Nota importada e salva."); rerender();
          } }
      ]
    });
  }

    { id: "cambio", label: "Câmbio", icon: "⇄" },
    { id: "processos", label: "Processos", icon: "▤" },
    { id: "analises", label: "Análises", icon: "📈" }
  ];

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "");
    var qIdx = h.indexOf("?");
    var query = {};
    if (qIdx >= 0) {
      h.substring(qIdx + 1).split("&").forEach(function (kv) {
        var p = kv.split("="); query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "");
      });
      h = h.substring(0, qIdx);
    }
    var parts = h.split("/").filter(Boolean).map(decodeURIComponent);
    return { route: parts[0] || "dashboard", param: parts[1], query: query };
  }

  var titles = {
    dashboard: "Painel de Controle", processos: "Processos de Importação", boletos: "Contas a Receber — Boletos",
    notas: "Notas Fiscais", cambio: "Controle de Câmbio", analises: "Análises Gerenciais", geral: "Processos - Geral", dre: "DRE", fluxo: "Fluxo de Caixa",
    clientes: "Clientes", historico: "Histórico de Alterações", backup: "Dados e Backup"
  };

  var App = {
    render: function () {
      var r = parseHash();
      // nav ativo
      Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (a) {
        a.classList.toggle("active", a.dataset.route === r.route);
      });
      var title = titles[r.route] || "—";
      if (r.route === "processos" && r.param) title = "Processo " + r.param;
      document.getElementById("page-title").textContent = title;

      var view;
      try {
        var V = window.Views;
        if (r.route === "processos" && r.param) view = V.processoDetail(r.param);
        else if (V[r.route]) view = V[r.route](r.query);
        else view = el("p", null, "Página não encontrada.");
      } catch (e) {
        view = el("div", { class: "error-box" }, ["Erro ao renderizar: ", el("pre", null, String(e && e.stack || e))]);
        console.error(e);
      }
      var main = document.getElementById("view");
      UI.clear(main);
      main.appendChild(view);
      UI.colorNegatives(main);
      main.scrollTop = 0;
    },

    init: function () {
      // sidebar
      var nav = document.getElementById("nav");
      NAV.forEach(function (n) {
        nav.appendChild(el("a", { class: "nav-item", href: "#/" + n.id, dataset: { route: n.id } }, [
          el("span", { class: "nav-icon" }, n.icon), el("span", { class: "nav-text" }, n.label)
        ]));
      });

      var btnSync = document.getElementById("btn-sync");
      if (btnSync) btnSync.addEventListener("click", function () {
        if (!window.Sync || !window.Sync.available) { UI.toast("Sincronização indisponível. Abra o sistema pelo 'Iniciar Sistema.bat'.", "warn"); return; }
        UI.confirmar("Recarregar TODOS os dados a partir das planilhas da pasta? A planilha é a fonte oficial; um backup automático é guardado antes.", function () {
          window.Sync.manual();
        }, { okLabel: "Sincronizar agora" });
      });

      var cloud = !!(window.SB && window.SB.configured);
      // botão de sair (nuvem)
      // sem login: esconde o botão de sair
      var btnLogout = document.getElementById("btn-logout");
      if (btnLogout) btnLogout.style.display = "none";
      // no modo nuvem, esconde o botão de sincronizar (planilha deixa de ser a fonte)
      if (cloud && btnSync) btnSync.style.display = "none";

      // menu lateral no celular (hambúrguer)
      var btnMenu = document.getElementById("btn-menu");
      var backdrop = document.getElementById("sidebar-backdrop");
      function closeMenu() { document.body.classList.remove("menu-open"); }
      if (btnMenu) btnMenu.addEventListener("click", function () { document.body.classList.toggle("menu-open"); });
      if (backdrop) backdrop.addEventListener("click", closeMenu);
      document.getElementById("nav").addEventListener("click", function (e) { if (e.target.closest(".nav-item")) closeMenu(); });

      window.addEventListener("hashchange", App.render);
      document.addEventListener("store:saved", function () {
        var s = document.getElementById("save-status");
        if (s) { s.textContent = "✔ salvo"; s.classList.add("show"); setTimeout(function () { s.classList.remove("show"); }, 1500); }
      });
      document.addEventListener("store:save-error", function () { UI.toast("Erro ao salvar na nuvem. Verifique sua conexão.", "danger"); });

      // acesso livre (sem login): entra direto no sistema
      App.boot();
    },

    boot: function () {
      if (App._booted) return; App._booted = true;
      var pre = (window.SB && window.SB.configured)
        ? window.SB.userEmail().then(function (email) {
            var nome = "";
            try { nome = (localStorage.getItem("akos_user_name") || "").trim(); } catch (e) {}
            var quem = nome || email || "usuário";
            Store.setUser(quem); App._userEmail = quem;
          }).catch(function () { })
        : Promise.resolve();
      pre.then(function () { return window.Store.init(); }).then(function () {
        var emp = window.Store.state.empresa || {};
        var sub = document.getElementById("brand-sub");
        if (sub) sub.textContent = (emp.importadora || "MRD") + " × " + (emp.adquirente || "AKOS");
        var who = document.getElementById("user-email");
        if (who && App._userEmail) who.textContent = App._userEmail;
        if (!location.hash) location.hash = "#/dashboard";
        App.render();
        if (Store.isCloud()) {
          // backup/histórico só quando houver sessão autenticada (a planilha/sync cuida disso)
          window.SB.getSession().then(function (sess) {
            if (sess) { Store.startBackupTimer(); Store.log("Entrou no sistema", null); }
          });
        } else if (window.Sync) { window.Sync.init(); }
      }).catch(function (e) {
        var v = document.getElementById("view");
        if (v) v.appendChild(el("div", { class: "error-box" }, "Falha ao carregar dados: " + (e && e.message ? e.message : e)));
        console.error(e);
      });
    },

    showLogin: function () {
      var ov = document.getElementById("login-overlay");
      if (ov) { ov.style.display = "flex"; return; }
      ov = el("div", { id: "login-overlay", class: "login-overlay" });
      var nome = el("input", { class: "inp", type: "text", placeholder: "seu nome", autocomplete: "name", value: (localStorage.getItem("akos_user_name") || "") });
      var pw = el("input", { class: "inp", type: "password", placeholder: "senha de acesso", autocomplete: "current-password" });
      var msg = el("div", { class: "login-msg" });
      var btn = el("button", { class: "btn btn-primary btn-block" }, "Entrar");
      function entrar() {
        msg.textContent = ""; btn.disabled = true; btn.textContent = "Entrando…";
        try { localStorage.setItem("akos_user_name", (nome.value || "").trim()); } catch (e) {}
        window.SB.signInShared(pw.value || "").then(function (r) {
          btn.disabled = false; btn.textContent = "Entrar";
          if (r.error) { msg.textContent = "Senha incorreta."; }
        }).catch(function () { btn.disabled = false; btn.textContent = "Entrar"; msg.textContent = "Falha ao entrar. Tente de novo."; });
      }
      btn.addEventListener("click", entrar);
      pw.addEventListener("keydown", function (e) { if (e.key === "Enter") entrar(); });
      ov.appendChild(el("div", { class: "login-card" }, [
        el("div", { class: "login-brand" }, [
          el("span", { class: "login-mark" }, "AKOS"), el("span", { class: "login-mark2" }, "Trading")
        ]),
        el("h2", null, "Controle Financeiro"),
        el("p", { class: "login-sub" }, "Digite a senha de acesso para entrar."),
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Seu nome (aparece no histórico)"), nome]),
        el("label", { class: "field" }, [el("span", { class: "field-label" }, "Senha de acesso"), pw]),
        msg, btn
      ]));
      document.body.appendChild(ov);
      setTimeout(function () { pw.focus(); }, 50);
    },
    hideLogin: function () {
      var ov = document.getElementById("login-overlay");
      if (ov) ov.style.display = "none";
    }
  };

  window.App = App;
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", App.init);
  else App.init();
})();

</script>
</body>
</html>
